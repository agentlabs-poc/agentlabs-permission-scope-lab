<text x="102" y="1017.8666666666666" font-family="Liberation Sans" font-size="26.666666666666668" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">Re-enabling does not reset expiry. Assignment-specific windows are deferred.</text>
<text x="84" y="1066.05" font-family="Liberation Sans" font-size="15" font-weight="400" fill="#52657A" text-anchor="start" xml:space="preserve">HANDBOOK OF AUTHORIZATION · OUR MODEL · CORE SHAPES, NOT COMPLETE SCHEMAS</text>
<text x="1802.4" y="1059.2333333333333" font-family="Liberation Sans" font-size="23.333333333333332" font-weight="400" fill="#52657A" text-anchor="middle" xml:space="preserve">20</text>
<text x="86.39999999999999" y="348.96666666666664" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">expires_at</text>
<text x="86.39999999999999" y="409.6666666666667" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">The exclusive end of the</text>
