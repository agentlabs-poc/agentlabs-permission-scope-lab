<text x="86.39999999999999" y="608.5666666666666" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">An optional inclusive start.</text>
<text x="86.39999999999999" y="701.6666666666666" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">Parent limits</text>
<text x="86.39999999999999" y="762.3666666666666" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">A local window cannot outlive</text>
<text x="86.39999999999999" y="807.4666666666666" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">required support.</text>
