<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#087E8B"/></marker></defs><rect width="1920" height="1080" fill="#F5F7FA"/>
<rect x="0" y="0" width="16.8" height="1080" rx="0" fill="#087E8B" stroke="#087E8B"/>
<text x="84" y="70.11666666666667" font-family="Liberation Sans" font-size="21.666666666666668" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">DEPENDENT AUTHORITY</text>
<text x="80.4" y="161.96666666666667" font-family="Liberation Sans" font-size="56.666666666666664" font-weight="700" fill="#14263D" text-anchor="start" xml:space="preserve">A child grant can only narrow</text>
<text x="84" y="240.65" font-family="Liberation Sans" font-size="35" font-weight="400" fill="#52657A" text-anchor="start" xml:space="preserve">G2 selects read and adds C17 to G1’s Finance boundary.</text>
<rect x="78" y="980.4" width="1764" height="61.2" rx="7.199999999999999" fill="#E3F3F2" stroke="#E3F3F2"/>
<text x="102" y="1017.8666666666666" font-family="Liberation Sans" font-size="26.666666666666668" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">Child {} retains the parent boundary. It never becomes an escape hatch.</text>
<text x="84" y="1066.05" font-family="Liberation Sans" font-size="15" font-weight="400" fill="#52657A" text-anchor="start" xml:space="preserve">HANDBOOK OF AUTHORIZATION · OUR MODEL · CORE SHAPES, NOT COMPLETE SCHEMAS</text>
<text x="1802.4" y="1059.2333333333333" font-family="Liberation Sans" font-size="23.333333333333332" font-weight="400" fill="#52657A" text-anchor="middle" xml:space="preserve">16</text>
<text x="86.39999999999999" y="348.96666666666664" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">Permission subset</text>
<text x="86.39999999999999" y="409.6666666666667" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">Read is selected from parent</text>
<text x="86.39999999999999" y="454.76666666666665" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">read/write.</text>
<text x="86.39999999999999" y="547.8666666666667" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">Scope AND</text>
<text x="86.39999999999999" y="608.5666666666666" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">Effective scope is Finance AND</text>
<text x="86.39999999999999" y="653.6666666666666" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">C17.</text>
<text x="86.39999999999999" y="746.7666666666667" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">Live dependency</text>
<text x="86.39999999999999" y="807.4666666666666" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">The parent definition alone is</text>
<text x="86.39999999999999" y="852.5666666666666" font-family="Liberation Sans" font-size="36.666666666666664" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">not support.</text>
<rect x="762" y="300" width="1080" height="660" rx="14.399999999999999" fill="#14263D" stroke="#14263D"/>
<text x="795.6" y="340.68333333333334" font-family="Liberation Sans" font-size="18.333333333333332" font-weight="700" fill="#83D4D6" text-anchor="start" xml:space="preserve">APPROVED CHILD GRANT-CONTENT SHAPE</text>
<text x="795.6" y="406.1833333333333" font-family="Liberation Mono" font-size="28.333333333333332" font-weight="400" fill="#ECF3FA" text-anchor="start" xml:space="preserve">{</text>
<text x="795.6" y="440.98333333333335" font-family="Liberation Mono" font-size="28.333333333333332" font-weight="400" fill="#ECF3FA" text-anchor="start" xml:space="preserve">  &quot;version&quot;: &quot;1&quot;,</text>
<text x="795.6" y="475.7833333333333" font-family="Liberation Mono" font-size="28.333333333333332" font-weight="400" fill="#ECF3FA" text-anchor="start" xml:space="preserve">  &quot;grant_id&quot;: &quot;G2&quot;,</text>
