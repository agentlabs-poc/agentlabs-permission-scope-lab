<text x="86.39999999999999" y="667.9333333333334" font-family="Liberation Sans" font-size="33.333333333333336" font-weight="400" fill="#14263D" text-anchor="start" xml:space="preserve">Who receives it: a human or group.</text>
<text x="86.39999999999999" y="732.2" font-family="Liberation Sans" font-size="33.333333333333336" font-weight="700" fill="#087E8B" text-anchor="start" xml:space="preserve">status</text>
