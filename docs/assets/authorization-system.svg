<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">AgentLabs authorization: one endpoint-owned gate</title>
  <desc id="diagram-description">A request is authenticated before entering an endpoint-owned authorization gate. A server-owned declaration supplies the required permission and material sources. The gate gathers sufficient material from verified context, selected request inputs, Auth authority, and required application facts. A shared evaluator checks complete grants. Allow proceeds through enforcement to the protected operation; denial or failure stops. There is no prepared handoff. This is a logical responsibility diagram, not a deployment topology.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#697a90"/>
    </marker>
    <marker id="allow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#18815d"/>
    </marker>
    <marker id="deny-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b94b56"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.7px; fill: #52637a; }
      .heading { font-size: 32px; font-weight: 700; fill: #172b44; }
      .subtitle { font-size: 16px; fill: #5b6b80; }
      .node-title { font-size: 19px; font-weight: 650; fill: #172b44; }
      .body { font-size: 14px; fill: #455972; }
      .small { font-size: 12px; fill: #5b6b80; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; fill: #52637a; }
      .edge { fill: none; stroke: #697a90; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .allow-edge { fill: none; stroke: #18815d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#allow-arrow); }
      .deny-edge { fill: none; stroke: #b94b56; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#deny-arrow); }
    </style>
  </defs>

  <rect width="1280" height="1160" fill="#f7f9fc"/>
  <text x="48" y="56" class="eyebrow">AGENTLABS / AUTHORIZATION HANDBOOK</text>
  <text x="48" y="100" class="heading">One endpoint-owned authorization gate</text>
  <text x="48" y="132" class="subtitle">Canonical logical model · One declaration · Shared evaluation · No prepared handoff</text>

  <!-- Logical ownership boundary; not a separate deployment or network service. -->
  <rect x="376" y="405" width="528" height="545" rx="24" fill="#edf3fb" stroke="#c3d2e5" stroke-width="1.5"/>
  <text x="400" y="436" class="tag">ENDPOINT-OWNED GATE</text>

  <!-- Connections are drawn before nodes so their endpoints meet node borders. -->
  <path d="M640 236 V278" class="edge"/>
  <path d="M640 364 V480" class="edge"/>
  <path d="M330 365 H352 V505 H416" class="edge"/>
  <path d="M330 561 H416" class="edge"/>
  <path d="M950 561 H864" class="edge"/>
  <path d="M640 606 V652" class="edge"/>
  <path d="M640 770 V830" class="allow-edge"/>
  <path d="M864 704 H1091 V716" class="deny-edge"/>
  <path d="M640 912 V986" class="allow-edge"/>
  <text x="660" y="805" class="tag" style="fill:#18815d">ALLOW</text>
  <text x="947" y="689" class="tag" style="fill:#a13d48">DENY / FAILURE</text>

  <g id="request">
    <rect x="520" y="176" width="240" height="60" rx="14" fill="#ffffff" stroke="#c3cedb" stroke-width="1.5"/>
    <text x="640" y="212" text-anchor="middle" class="node-title">Request</text>
  </g>

  <g id="authentication">
    <rect x="440" y="278" width="400" height="86" rx="16" fill="#ffffff" stroke="#b4c8e0" stroke-width="1.5"/>
    <text x="640" y="313" text-anchor="middle" class="node-title">Authenticate</text>
    <text x="640" y="339" text-anchor="middle" class="body">Establish verified identity and trusted tenant</text>
  </g>

  <g id="endpoint-declaration">
    <rect x="48" y="288" width="282" height="148" rx="16" fill="#fffaf0" stroke="#e1c785" stroke-width="1.5"/>
    <text x="70" y="314" class="tag" style="fill:#856724">SERVER-OWNED CONTRACT</text>
    <text x="70" y="344" class="node-title">Endpoint declaration</text>
    <text x="70" y="372" class="body">Required permission</text>
    <text x="70" y="395" class="body">Identified material + its sources</text>
    <text x="70" y="418" class="small">Method / route · selected path / body</text>
  </g>

  <g id="auth-authority">
    <rect x="48" y="485" width="282" height="152" rx="16" fill="#eff6ff" stroke="#a9c5e8" stroke-width="1.5"/>
    <text x="70" y="513" class="tag" style="fill:#35649d">AUTH-OWNED AUTHORITY</text>
    <text x="70" y="544" class="node-title">Applicable grants</text>
    <text x="70" y="574" class="body">Roles and memberships</text>
    <text x="70" y="598" class="body">Delegation dependencies</text>
    <text x="70" y="621" class="small">Shared loading; freshness contract applies</text>
  </g>

  <g id="application-facts">
    <rect x="950" y="485" width="282" height="152" rx="16" fill="#effaf7" stroke="#a4d4c4" stroke-width="1.5"/>
    <text x="972" y="513" class="tag" style="fill:#30745d">APPLICATION-OWNED FACTS</text>
    <text x="972" y="544" class="node-title">Required target facts</text>
    <text x="972" y="574" class="body">Attributes and relationships</text>
    <text x="972" y="598" class="body">Only as needed to decide</text>
    <text x="972" y="621" class="small">Bounded internal lookups; no disclosure</text>
  </g>

  <g id="material-gathering">
    <rect x="416" y="480" width="448" height="126" rx="16" fill="#ffffff" stroke="#adc3de" stroke-width="1.5"/>
    <text x="640" y="518" text-anchor="middle" class="node-title">Gather sufficient material</text>
    <text x="640" y="548" text-anchor="middle" class="body">Verified context + identified path / body inputs</text>
    <text x="640" y="574" text-anchor="middle" class="body">Obtain authority and required application facts</text>
  </g>

  <g id="shared-evaluator">
    <rect x="416" y="652" width="448" height="118" rx="16" fill="#f6f2ff" stroke="#baace0" stroke-width="1.5"/>
    <text x="640" y="689" text-anchor="middle" class="node-title">Shared authorization evaluator</text>
    <text x="640" y="719" text-anchor="middle" class="body">Permission + target within scope boundary</text>
    <text x="640" y="745" text-anchor="middle" class="small">Applicability · validity · conditions · tenant / dependency limits</text>
  </g>

  <g id="stop">
    <rect x="950" y="716" width="282" height="112" rx="16" fill="#fff2f3" stroke="#dea7ae" stroke-width="1.5"/>
    <text x="1091" y="753" text-anchor="middle" class="node-title" style="fill:#9e3543">Stop</text>
    <text x="1091" y="782" text-anchor="middle" class="body">No protected output or mutation</text>
    <text x="1091" y="807" text-anchor="middle" class="small">Failure never establishes authority</text>
  </g>

  <g id="enforcement">
    <rect x="416" y="830" width="448" height="82" rx="16" fill="#edf9f2" stroke="#a1cbb1" stroke-width="1.5"/>
    <text x="640" y="862" text-anchor="middle" class="node-title" style="fill:#246446">Enforce the decision</text>
    <text x="640" y="888" text-anchor="middle" class="body">Bind actual use to the authorized restrictions</text>
  </g>

  <g id="protected-operation">
    <rect x="416" y="986" width="448" height="78" rx="16" fill="#ffffff" stroke="#a1cbb1" stroke-width="1.5"/>
    <text x="640" y="1019" text-anchor="middle" class="node-title">Protected operation / response</text>
    <text x="640" y="1044" text-anchor="middle" class="body">Proceed only under established authority</text>
  </g>

  <path d="M48 1090 H1232" stroke="#dce3ec"/>
  <text x="48" y="1117" class="small">Logical responsibilities, not deployment topology or a required number of network calls.</text>
  <text x="48" y="1139" class="small">Authentication and material-gathering failures also stop execution. CONTRACT-006 / CONTRACT-007 / INPUT-001 / ENFORCEMENT-002</text>
</svg>
