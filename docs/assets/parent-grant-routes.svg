<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc">
  <title id="title">Q-101: do not mix direct, subgroup, and shared-grant cases</title>
  <desc id="desc">Panel one: removing G1's Team1 assignment alone does not break G2's direct Nutan assignment when remaining G1 support is valid. Panel two: TeamY under Team1 needs G1 at Team1, not TeamX. Panel three: disabling shared G2 stops its authority for both TeamY and Nutan. Membership and administrative permission are separate from ownership.</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#2563eb"/></marker>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#b45309"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#047857"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.a{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blue)}.p{fill:none;stroke:#b45309;stroke-width:3;marker-end:url(#amber)}.t{fill:none;stroke:#047857;stroke-width:3;marker-end:url(#green)}</style>
  </defs>
  <rect width="1200" height="1140" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Q-101 · Three cases, kept separate</text>
  <text x="40" y="80" class="small">G2 derives from G1 · Blue = assignment · Amber = grant parent · Green = team parent</text>
  <rect x="30" y="105" width="1140" height="305" rx="14" fill="#eff6ff"/>
  <text x="55" y="145" class="head">1 · Original direct-human case</text>
  <text x="55" y="185" class="body">Remove A1 alone.</text>
  <text x="55" y="215" class="body">Nutan's direct G2 route remains</text>
  <text x="55" y="245" class="body">usable with valid remaining support.</text>
  <text x="55" y="295" class="small">Maya: member of Team1 and TeamX;</text>
  <text x="55" y="321" class="small">separate assignment-operation authority.</text>
  <text x="55" y="347" class="small">No ownership or implicit issuer dependency.</text>
  <rect x="490" y="140" width="150" height="65" rx="10" class="box"/><text x="543" y="180" class="head">G1</text>
  <rect x="925" y="130" width="205" height="65" rx="10" class="box"/><text x="990" y="170" class="head">Team1</text>
  <path d="M640 162 H918" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="695" y="143" class="small">A1 removed</text><path d="M760 150 L784 174 M784 150 L760 174" stroke="#dc2626" stroke-width="3"/>
  <rect x="925" y="245" width="205" height="65" rx="10" class="box"/><text x="990" y="285" class="head">TeamX</text>
  <path d="M640 190 H875 V277 H918" class="a"/><text x="750" y="217" class="small">AX remains</text>
  <rect x="490" y="290" width="150" height="65" rx="10" class="box"/><text x="543" y="330" class="head">G2</text>
  <path d="M565 290 V211" class="p"/><text x="585" y="259" class="small">parent</text>
  <rect x="720" y="290" width="150" height="65" rx="10" class="box"/><text x="761" y="330" class="head">Nutan</text>
  <path d="M640 323 H713" class="a"/><text x="685" y="382" class="small">Direct assignment unchanged</text>
  <rect x="30" y="430" width="1140" height="310" rx="14" fill="#ecfdf5"/>
  <text x="55" y="475" class="head">2 · Separate subteam case</text>
  <text x="55" y="515" class="body">TeamY needs G1 at Team1.</text>
  <text x="55" y="545" class="body">G1 at TeamX is not a substitute.</text>
  <text x="55" y="595" class="small">Protect structural changes through</text>
  <text x="55" y="621" class="small">bottom-up disablement/removal of</text>
  <text x="55" y="647" class="small">affected bindings. Re-enable only</text>
  <text x="55" y="673" class="small">after current-state validation.</text>
  <rect x="490" y="480" width="150" height="65" rx="10" class="box"/><text x="543" y="520" class="head">G1</text>
  <rect x="925" y="480" width="205" height="65" rx="10" class="box"/><text x="990" y="520" class="head">Team1</text>
  <path d="M640 512 H918" class="a"/><text x="750" y="493" class="small">A1</text>
  <rect x="490" y="640" width="150" height="65" rx="10" class="box"/><text x="543" y="680" class="head">G2</text>
  <rect x="925" y="640" width="205" height="65" rx="10" class="box"/><text x="990" y="680" class="head">TeamY</text>
  <path d="M640 672 H918" class="a"/><text x="750" y="653" class="small">A2</text>
  <path d="M565 640 V552" class="p"/><text x="585" y="595" class="small">parent grant</text>
  <path d="M1027 640 V552" class="t"/><text x="865" y="595" class="small">parent team</text>
  <rect x="30" y="760" width="1140" height="340" rx="14" fill="#fff7ed"/>
  <text x="55" y="805" class="head">3 · Combined shared-G2 case</text>
  <text x="55" y="845" class="body">Disable the grant G2:</text>
  <text x="55" y="875" class="body">neither recipient gets G2 authority.</text>
  <text x="55" y="925" class="small">Assignments remain stored.</text>
  <text x="55" y="951" class="small">Other valid grants remain separate.</text>
  <text x="55" y="1001" class="small">Disable only A2 instead:</text>
  <text x="55" y="1027" class="small">only that assignment route stops.</text>
  <rect x="490" y="860" width="210" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="535" y="902" class="head">G2 disabled</text><text x="515" y="938" class="small">Parent remains G1</text>
  <rect x="925" y="835" width="205" height="65" rx="10" class="box"/><text x="990" y="875" class="head">TeamY</text>
  <rect x="925" y="970" width="205" height="65" rx="10" class="box"/><text x="994" y="1010" class="head">Nutan</text>
  <path d="M700 887 H810 V867 H918" class="a"/><text x="823" y="850" class="small">A2</text>
  <path d="M700 945 H810 V1002 H918" class="a"/>
  <text x="720" y="1072" class="small">Stored assignment ≠ effective authority</text>
</svg>
