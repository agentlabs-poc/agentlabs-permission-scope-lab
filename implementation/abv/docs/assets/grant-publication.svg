<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" role="img" aria-labelledby="title desc">
  <title id="title">Grant publication is separate from assignment adoption</title>
  <desc id="desc">Within tenant and application context, a CLI publication request passes administrative authority and parent-boundary validation before immutable insertion in one transaction. Existing assignments retain their adopted revision. The supporting assignment identifier is transient evidence, not a stored dependency.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#334155"/></marker>
    <style>
      text{font-family:system-ui,sans-serif;fill:#172033;font-size:16px}
      .heading{font-size:23px;font-weight:700}.label{font-weight:650}.small{font-size:14px}
      .box{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:9}
      .arrow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="940" height="720" fill="#f8fafc"/>
  <text x="30" y="38" class="heading">Publish a revision — do not change its assignments</text>
  <text x="30" y="66">Prototype flow · explicit tenant + application on every operation</text>
  <rect class="box" x="230" y="90" width="480" height="72"/>
  <text x="250" y="118" class="label">CLI → reusable ABV facade</text>
  <text x="250" y="143">Maya + G2/revision 2 + supporting assignment A1</text>
  <path class="arrow" d="M470 162 V201"/>
  <rect x="205" y="184" width="710" height="369" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="6 4"/>
  <text x="725" y="208" class="small">One transaction</text>
  <rect class="box" x="230" y="215" width="480" height="65"/>
  <text x="250" y="242" class="label">1. Administrative authority</text>
  <text x="250" y="266">May Maya publish this grant revision?</text>
  <path class="arrow" d="M470 280 V315"/>
  <rect class="box" x="230" y="315" width="480" height="92"/>
  <text x="250" y="342" class="label">2. Authority-boundary validation</text>
  <text x="250" y="367">Resolve A1 → actual adopted G1 and its ancestors.</text>
  <text x="250" y="392">Check Maya's source, registrations and child subset.</text>
  <rect class="box" x="20" y="311" width="170" height="105"/>
  <text x="35" y="337" class="label">Current evidence</text>
  <text x="35" y="361" class="small">Teams, memberships,</text>
  <text x="35" y="381" class="small">adopted grants, roles,</text>
  <text x="35" y="401" class="small">catalog and controls</text>
  <path class="arrow" d="M190 363 H230"/>
  <path class="arrow" d="M470 407 V447"/>
  <rect class="box" x="230" y="447" width="480" height="78"/>
  <text x="250" y="474" class="label">3. INSERT immutable G2/revision 2</text>
  <text x="250" y="499">Same parent; newer revision; keep G2/revision 1.</text>
  <rect x="743" y="306" width="150" height="97" rx="9" fill="#fff1f2" stroke="#be123c"/>
  <text x="758" y="334" class="label">Any failure</text>
  <text x="758" y="360">No publication.</text>
  <text x="758" y="384" class="small">No partial writes.</text>
  <path class="arrow" d="M710 248 H820 V306"/>
  <path class="arrow" d="M710 361 H743"/>
  <path class="arrow" d="M470 525 V583"/>
  <rect x="230" y="583" width="480" height="68" rx="9" fill="#f0fdf4" stroke="#15803d"/>
  <text x="250" y="610" class="label">A2 → Team2 still adopts G2/revision 1</text>
  <text x="250" y="635">Adoption is a separate authorized, validated write.</text>
  <text x="30" y="684" class="small">A1 is transient publication input. G2 stores parent_grant_id only; no remembered publisher dependency.</text>
</svg>
