<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#5b6478"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#1f6b45"/>
    </marker>
  </defs>
  <rect width="820" height="560" fill="#fbfcfe"/>

  <text x="30" y="34" font-size="14" font-weight="600" fill="#16202e">The composition root</text>
  <text x="30" y="54" font-size="11.5" fill="#5b6478">who imports whom — and the one place the two domains meet</text>

  <rect x="240" y="78" width="340" height="76" rx="5" fill="#f3eef5" stroke="#6d4a76" stroke-width="1.6"/>
  <text x="410" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#16202e">implementation/wiring</text>
  <text x="410" y="123" text-anchor="middle" font-size="11" fill="#6d4a76">the composition root</text>
  <text x="410" y="141" text-anchor="middle" font-size="10.5" fill="#5b6478">the ONLY package that imports both</text>

  <path d="M330 154 L180 214" fill="none" stroke="#5b6478" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M490 154 L640 214" fill="none" stroke="#5b6478" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="214" y="190" font-size="10.5" fill="#5b6478">imports</text>
  <text x="556" y="190" font-size="10.5" fill="#5b6478">imports</text>

  <rect x="30" y="218" width="300" height="186" rx="5" fill="#eef3f9" stroke="#26608f" stroke-width="1.4"/>
  <text x="180" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#16202e">abv</text>
  <text x="180" y="261" text-anchor="middle" font-size="10.5" fill="#5b6478">the Auth-AL domain</text>
  <rect x="48" y="276" width="264" height="66" rx="4" fill="#ffffff" stroke="#26608f" stroke-width="1"/>
  <text x="60" y="296" font-size="11" font-weight="600" fill="#16202e">DECLARES the shape it needs</text>
  <text x="60" y="314" font-size="10.5" fill="#26608f" font-family="ui-monospace, monospace">type Registry interface {</text>
  <text x="60" y="330" font-size="10.5" fill="#26608f" font-family="ui-monospace, monospace">  ApplicationExists · Installed }</text>
  <text x="180" y="366" text-anchor="middle" font-size="10.5" fill="#5b6478">abv_l1_records</text>
  <text x="180" y="386" text-anchor="middle" font-size="10.5" fill="#a8452f">names no one</text>

  <rect x="490" y="218" width="300" height="186" rx="5" fill="#eef3f9" stroke="#26608f" stroke-width="1.4"/>
  <text x="640" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#16202e">registry</text>
  <text x="640" y="261" text-anchor="middle" font-size="10.5" fill="#5b6478">the application registry domain</text>
  <rect x="508" y="276" width="264" height="66" rx="4" fill="#ffffff" stroke="#26608f" stroke-width="1"/>
  <text x="520" y="296" font-size="11" font-weight="600" fill="#16202e">PROVIDES a type with those methods</text>
  <text x="520" y="314" font-size="10.5" fill="#26608f" font-family="ui-monospace, monospace">func (p *Port) ApplicationExists</text>
  <text x="520" y="330" font-size="10.5" fill="#26608f" font-family="ui-monospace, monospace">func (p *Port) Installed</text>
  <text x="640" y="366" text-anchor="middle" font-size="10.5" fill="#5b6478">application_registry_l1_records</text>
  <text x="640" y="386" text-anchor="middle" font-size="10.5" fill="#a8452f">names no one</text>

  <line x1="330" y1="310" x2="506" y2="310" stroke="#1f6b45" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <rect x="352" y="286" width="132" height="20" rx="3" fill="#fbfcfe"/>
  <text x="418" y="301" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f6b45">satisfies it</text>
  <text x="418" y="330" text-anchor="middle" font-size="10" fill="#1f6b45">structurally — no import</text>

  <line x1="330" y1="256" x2="490" y2="256" stroke="#a8452f" stroke-width="1.4"/>
  <line x1="398" y1="240" x2="422" y2="272" stroke="#a8452f" stroke-width="2"/>
  <line x1="422" y1="240" x2="398" y2="272" stroke="#a8452f" stroke-width="2"/>
  <text x="410" y="232" text-anchor="middle" font-size="10.5" fill="#a8452f">0 imports, either way</text>

  <rect x="30" y="428" width="760" height="104" rx="5" fill="#f7f8fa" stroke="#d9dee6" stroke-width="1"/>
  <text x="46" y="452" font-size="11.5" font-weight="600" fill="#16202e">What &quot;composition&quot; means: the root is where concrete choices are made</text>
  <text x="46" y="474" font-size="10.5" fill="#5b6478">Both domains are written against interfaces and never learn what they are handed. The root hands them the real thing:</text>
  <text x="46" y="496" font-size="10.5" fill="#26608f" font-family="ui-monospace, monospace">port, _ := registry.NewPort(reg, operator)          // build the concrete adapter</text>
  <text x="46" y="512" font-size="10.5" fill="#26608f" font-family="ui-monospace, monospace">facade, _ := abv.OpenSQLiteWithRegistry(…, port)    // hand it to Auth-AL</text>
  <text x="560" y="496" font-size="10.5" fill="#1f6b45">swap the legacy service in?</text>
  <text x="560" y="512" font-size="10.5" fill="#1f6b45">one line, here. Neither domain moves.</text>
</svg>
