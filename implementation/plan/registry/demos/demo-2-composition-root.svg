<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1872" width="640" height="1872" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="640" height="1872" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h626a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="320.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">the composition root — two binaries, two stores, one seam</text>
<text x="18" y="60" fill="#d9a441" xml:space="preserve">══ 1 · nothing registered — Auth-AL cannot read the tenant&#x27;s authority ══</text>
<text x="18" y="80" fill="#4fb8e8" xml:space="preserve">$ authority read --tenant acme --app hrms</text>
<text x="18" y="100" fill="#9aa4b4" xml:space="preserve">    registry says   application=false  installed=false</text>
<text x="18" y="120" fill="#9aa4b4" xml:space="preserve">    auth-al         refused at the installation gate</text>
<text x="18" y="140" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="160" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="180" fill="#d9a441" xml:space="preserve">══ 2 · register and install, in the OTHER domain&#x27;s store ══</text>
<text x="18" y="200" fill="#4fb8e8" xml:space="preserve">$ registry register hrms --name HRMS</text>
<text x="18" y="220" fill="#9aa4b4" xml:space="preserve">    application</text>
<text x="18" y="240" fill="#9aa4b4" xml:space="preserve">    slug  hrms</text>
<text x="18" y="260" fill="#9aa4b4" xml:space="preserve">    name  HRMS</text>
<text x="18" y="280" fill="#9aa4b4" xml:space="preserve">    status  active</text>
<text x="18" y="300" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="320" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="340" fill="#4fb8e8" xml:space="preserve">$ registry install hrms --tenant acme</text>
<text x="18" y="360" fill="#9aa4b4" xml:space="preserve">    installation</text>
<text x="18" y="380" fill="#9aa4b4" xml:space="preserve">    installed  tenant=acme  slug=hrms</text>
<text x="18" y="400" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="420" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="440" fill="#d9a441" xml:space="preserve">══ 3 · Auth-AL now gets PAST the gate — nothing was passed to it ══</text>
<text x="18" y="460" fill="#4fb8e8" xml:space="preserve">$ authority read --tenant acme --app hrms</text>
<text x="18" y="480" fill="#9aa4b4" xml:space="preserve">    registry says   application=true  installed=true</text>
<text x="18" y="500" fill="#9aa4b4" xml:space="preserve">    auth-al         past the gate, then its own: record not found</text>
<text x="18" y="520" fill="#e0787c" xml:space="preserve">    rc=4</text>
<text x="18" y="540" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="560" fill="#d9a441" xml:space="preserve">══ 4 · suspend it: the adapter maps suspended to absent ══</text>
<text x="18" y="580" fill="#4fb8e8" xml:space="preserve">$ registry status hrms --set suspended</text>
<text x="18" y="600" fill="#9aa4b4" xml:space="preserve">    application</text>
<text x="18" y="620" fill="#9aa4b4" xml:space="preserve">    slug  hrms</text>
<text x="18" y="640" fill="#9aa4b4" xml:space="preserve">    name  HRMS</text>
<text x="18" y="660" fill="#9aa4b4" xml:space="preserve">    status  suspended</text>
<text x="18" y="680" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="700" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="720" fill="#4fb8e8" xml:space="preserve">$ authority read --tenant acme --app hrms</text>
<text x="18" y="740" fill="#9aa4b4" xml:space="preserve">    registry says   application=false  installed=true</text>
<text x="18" y="760" fill="#9aa4b4" xml:space="preserve">    auth-al         refused at the installation gate</text>
<text x="18" y="780" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="800" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="820" fill="#4fb8e8" xml:space="preserve">$ registry status hrms --set active</text>
<text x="18" y="840" fill="#9aa4b4" xml:space="preserve">    application</text>
<text x="18" y="860" fill="#9aa4b4" xml:space="preserve">    slug  hrms</text>
<text x="18" y="880" fill="#9aa4b4" xml:space="preserve">    name  HRMS</text>
<text x="18" y="900" fill="#9aa4b4" xml:space="preserve">    status  active</text>
<text x="18" y="920" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="940" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="960" fill="#d9a441" xml:space="preserve">══ 5 · DISABLE for one tenant — reversible, and not an uninstall ══</text>
<text x="18" y="980" fill="#4fb8e8" xml:space="preserve">$ registry disable hrms --tenant acme</text>
<text x="18" y="1000" fill="#9aa4b4" xml:space="preserve">    installation</text>
<text x="18" y="1020" fill="#9aa4b4" xml:space="preserve">    tenant  acme</text>
<text x="18" y="1040" fill="#9aa4b4" xml:space="preserve">    slug  hrms</text>
<text x="18" y="1060" fill="#9aa4b4" xml:space="preserve">    status  disabled</text>
<text x="18" y="1080" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1100" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1120" fill="#4fb8e8" xml:space="preserve">$ authority read --tenant acme --app hrms</text>
<text x="18" y="1140" fill="#9aa4b4" xml:space="preserve">    registry says   application=true  installed=false</text>
<text x="18" y="1160" fill="#9aa4b4" xml:space="preserve">    auth-al         refused at the installation gate</text>
<text x="18" y="1180" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="1200" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1220" fill="#4fb8e8" xml:space="preserve">$ registry installations --slug hrms</text>
<text x="18" y="1240" fill="#9aa4b4" xml:space="preserve">    installations</text>
<text x="18" y="1260" fill="#9aa4b4" xml:space="preserve">    count  1</text>
<text x="18" y="1280" fill="#9aa4b4" xml:space="preserve">    total  1</text>
<text x="18" y="1300" fill="#9aa4b4" xml:space="preserve">    tenant=acme       slug=hrms       disabled</text>
<text x="18" y="1320" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1340" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1360" fill="#4fb8e8" xml:space="preserve">$ registry enable hrms --tenant acme</text>
<text x="18" y="1380" fill="#9aa4b4" xml:space="preserve">    installation</text>
<text x="18" y="1400" fill="#9aa4b4" xml:space="preserve">    tenant  acme</text>
<text x="18" y="1420" fill="#9aa4b4" xml:space="preserve">    slug  hrms</text>
<text x="18" y="1440" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="18" y="1460" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1480" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1500" fill="#4fb8e8" xml:space="preserve">$ authority read --tenant acme --app hrms</text>
<text x="18" y="1520" fill="#9aa4b4" xml:space="preserve">    registry says   application=true  installed=true</text>
<text x="18" y="1540" fill="#9aa4b4" xml:space="preserve">    auth-al         past the gate, then its own: record not found</text>
<text x="18" y="1560" fill="#e0787c" xml:space="preserve">    rc=4</text>
<text x="18" y="1580" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1600" fill="#d9a441" xml:space="preserve">══ 6 · uninstall: destructive, and the record is gone ══</text>
<text x="18" y="1620" fill="#4fb8e8" xml:space="preserve">$ registry uninstall hrms --tenant acme</text>
<text x="18" y="1640" fill="#9aa4b4" xml:space="preserve">    installation</text>
<text x="18" y="1660" fill="#9aa4b4" xml:space="preserve">    uninstalled  tenant=acme  slug=hrms</text>
<text x="18" y="1680" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1700" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1720" fill="#4fb8e8" xml:space="preserve">$ authority read --tenant acme --app hrms</text>
<text x="18" y="1740" fill="#9aa4b4" xml:space="preserve">    registry says   application=true  installed=false</text>
<text x="18" y="1760" fill="#9aa4b4" xml:space="preserve">    auth-al         refused at the installation gate</text>
<text x="18" y="1780" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="1800" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1820" fill="#d9a441" xml:space="preserve">══ two stores, two domains, no shared table ══</text>
<text x="18" y="1840" fill="#9aa4b4" xml:space="preserve">  registry  : registry_metadata application_registry_l1_records</text>
<text x="18" y="1860" fill="#9aa4b4" xml:space="preserve">  authority : abv_metadata abv_l1_records</text>
</svg>