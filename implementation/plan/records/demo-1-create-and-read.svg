<text x="324.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — register · get</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># registration is the only way a permission comes into existence</text>
<text x="22" y="83" fill="#4fb8e8">$</text>
<text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv catalog register-permission hrms:employee:certificate::read</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">id      hrms:employee:certificate::read</text>
<text x="22" y="125" fill="#6cc292" xml:space="preserve">active  true</text>
<text x="22" y="167" fill="#4fb8e8">$</text>
<text x="38.8" y="167" fill="#e8ecf2" xml:space="preserve">abv catalog register-permission hrms:employee:certificate::write</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">id      hrms:employee:certificate::write</text>
<text x="22" y="209" fill="#6cc292" xml:space="preserve">active  true</text>
<text x="22" y="251" fill="#6b7687" xml:space="preserve"># add-only — the same identifier again is a conflict, never an overwrite</text>
<text x="22" y="272" fill="#4fb8e8">$</text>
<text x="38.8" y="272" fill="#e8ecf2" xml:space="preserve">abv catalog register-permission hrms:employee:certificate::read</text>
<text x="22" y="293" fill="#e0787c" xml:space="preserve">operation conflict                                    rc=4</text>
<text x="22" y="335" fill="#6b7687" xml:space="preserve"># the grammar is enforced: this cannot decompose into key slots</text>
<text x="22" y="356" fill="#4fb8e8">$</text>
<text x="38.8" y="356" fill="#e8ecf2" xml:space="preserve">abv catalog register-permission hrms:employee:certificate:read</text>
<text x="22" y="377" fill="#e0787c" xml:space="preserve">malformed input                                       rc=2</text>
<text x="22" y="419" fill="#6b7687" xml:space="preserve"># a typed read by exact identifier</text>
<text x="22" y="440" fill="#4fb8e8">$</text>
<text x="38.8" y="440" fill="#e8ecf2" xml:space="preserve">abv catalog get-permission hrms:employee:certificate::read</text>
<text x="22" y="461" fill="#9aa4b4" xml:space="preserve">id      hrms:employee:certificate::read</text>
<text x="22" y="482" fill="#6cc292" xml:space="preserve">active  true</text>
<text x="22" y="524" fill="#4fb8e8">$</text>
