<text x="22" y="545" fill="#e0787c" xml:space="preserve">operation rejected or record not found                rc=3</text>
<text x="22" y="587" fill="#6b7687" xml:space="preserve"># no wildcards, ever</text>
<text x="22" y="608" fill="#4fb8e8">$</text>
<text x="38.8" y="608" fill="#e8ecf2" xml:space="preserve">abv catalog get-permission &#x27;hrms:*::read&#x27;</text>
