<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 652" width="632" height="652" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="632" height="652" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h618a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="316.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — bounds · measured cost</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># the page size is capped, not silently clamped</text>
<text x="22" y="83" fill="#4fb8e8">$</text>
<text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --limit 9999</text>
<text x="22" y="104" fill="#e0787c" xml:space="preserve">malformed input                                       rc=2</text>
<text x="22" y="146" fill="#6b7687" xml:space="preserve"># a prefix must end on a whole noun segment: a partial one has no</text>
<text x="22" y="167" fill="#6b7687" xml:space="preserve"># structural form and would fall back to a string match</text>
<text x="22" y="188" fill="#4fb8e8">$</text>
<text x="38.8" y="188" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --prefix hrms:emp</text>
<text x="22" y="209" fill="#e0787c" xml:space="preserve">malformed input                                       rc=2</text>
<text x="22" y="251" fill="#6b7687" xml:space="preserve"># a filter matching nothing is an empty page, never a fallback to all</text>
<text x="22" y="272" fill="#4fb8e8">$</text>
<text x="38.8" y="272" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --prefix codehost:</text>
<text x="22" y="293" fill="#9aa4b4" xml:space="preserve">count  0     total  0       generation  607</text>
<text x="22" y="335" fill="#e8ecf2" xml:space="preserve">MEASURED — 600 permissions, one application</text>
<text x="22" y="377" fill="#9aa4b4" xml:space="preserve">  list  offset 0    limit 50            225 us</text>
<text x="22" y="398" fill="#9aa4b4" xml:space="preserve">  list  offset 300  limit 50            269 us</text>
<text x="22" y="419" fill="#9aa4b4" xml:space="preserve">  list  offset 550  limit 50            335 us</text>
<text x="22" y="440" fill="#9aa4b4" xml:space="preserve">  list  offset 599  limit 50            369 us</text>
<text x="22" y="461" fill="#9aa4b4" xml:space="preserve">  list  prefix hrms:payroll:            505 us</text>
<text x="22" y="482" fill="#6cc292" xml:space="preserve">  get   by identifier                     1 us</text>
<text x="22" y="524" fill="#6b7687" xml:space="preserve"># depth costs ~60% more, not 100x: the work is loading and ordering</text>
<text x="22" y="545" fill="#6b7687" xml:space="preserve"># the catalog, not skipping rows. offset is sound at this scale.</text>
<text x="22" y="587" fill="#e0787c" xml:space="preserve">  full catalog read from storage        7.5 ms</text>
<text x="22" y="608" fill="#6b7687" xml:space="preserve"># and every authority resolution performs one — that snapshot ceiling,</text>
<text x="22" y="629" fill="#6b7687" xml:space="preserve"># not paging, is the thing to fix first</text>
</svg>