<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 2269" width="816" height="2269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="816" height="2269" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h802a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="408.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">the caller need not be the subject — an application asks about many humans</text>
<text x="22" y="62" fill="#d9a441" xml:space="preserve">══ THE OLD SHAPE — a human asking about themselves ══</text>
<text x="22" y="83" fill="#4fb8e8">$</text>
<text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv resolve --human fi7io4lvjqio --no-source</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="125" fill="#9aa4b4" xml:space="preserve">      &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="146" fill="#9aa4b4" xml:space="preserve">      &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="167" fill="#9aa4b4" xml:space="preserve">      &quot;application_id&quot;: &quot;hrms&quot;,</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">      &quot;human_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">      &quot;resolved_grants&quot;: [</text>
<text x="22" y="230" fill="#9aa4b4" xml:space="preserve">        {</text>
<text x="22" y="251" fill="#9aa4b4" xml:space="preserve">          &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="272" fill="#9aa4b4" xml:space="preserve">          &quot;grant_id&quot;: &quot;fk3x9r2m5iv8&quot;,</text>
<text x="22" y="293" fill="#9aa4b4" xml:space="preserve">          &quot;revision&quot;: 1,</text>
<text x="22" y="314" fill="#9aa4b4" xml:space="preserve">          &quot;parent_grant_id&quot;: &quot;fk3x9r2m0dq3&quot;,</text>
<text x="22" y="335" fill="#9aa4b4" xml:space="preserve">          &quot;permissions&quot;: [</text>
<text x="22" y="356" fill="#9aa4b4" xml:space="preserve">            &quot;hrms:payroll:payslip::read&quot;,</text>
<text x="22" y="377" fill="#9aa4b4" xml:space="preserve">            &quot;hrms:payroll:payslip::write&quot;</text>
<text x="22" y="398" fill="#9aa4b4" xml:space="preserve">          ],</text>
<text x="22" y="419" fill="#9aa4b4" xml:space="preserve">          &quot;scope&quot;: {</text>
<text x="22" y="440" fill="#9aa4b4" xml:space="preserve">            &quot;dept&quot;: &quot;FIN&quot;</text>
<text x="22" y="461" fill="#9aa4b4" xml:space="preserve">          }</text>
<text x="22" y="482" fill="#9aa4b4" xml:space="preserve">        }</text>
<text x="22" y="503" fill="#9aa4b4" xml:space="preserve">      ]</text>
<text x="22" y="524" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="545" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="587" fill="#d9a441" xml:space="preserve">══ THE NEW ONE — an application asking about somebody else ══</text>
<text x="22" y="608" fill="#6b7687" xml:space="preserve">   (agent_hrms is the lab&#x27;s stand-in for a workload credential, bound to</text>
<text x="22" y="629" fill="#9aa4b4" xml:space="preserve">    one tenant application. The binding is what the gate compares; nothing</text>
<text x="22" y="650" fill="#9aa4b4" xml:space="preserve">    about the subject is checked, because the application is none of them.)</text>
<text x="22" y="692" fill="#4fb8e8">$</text>
<text x="38.8" y="692" fill="#e8ecf2" xml:space="preserve">abv resolve --human fi7io4lvjwu8 --client agent_hrms --no-source</text>
<text x="22" y="713" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="734" fill="#9aa4b4" xml:space="preserve">      &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="755" fill="#9aa4b4" xml:space="preserve">      &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="776" fill="#9aa4b4" xml:space="preserve">      &quot;application_id&quot;: &quot;hrms&quot;,</text>
<text x="22" y="797" fill="#9aa4b4" xml:space="preserve">      &quot;human_id&quot;: &quot;fi7io4lvjwu8&quot;,</text>
<text x="22" y="818" fill="#9aa4b4" xml:space="preserve">      &quot;resolved_grants&quot;: [</text>
<text x="22" y="839" fill="#9aa4b4" xml:space="preserve">        {</text>
<text x="22" y="860" fill="#9aa4b4" xml:space="preserve">          &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="881" fill="#9aa4b4" xml:space="preserve">          &quot;grant_id&quot;: &quot;fk3x9r2man0d&quot;,</text>
<text x="22" y="902" fill="#9aa4b4" xml:space="preserve">          &quot;revision&quot;: 1,</text>
<text x="22" y="923" fill="#9aa4b4" xml:space="preserve">          &quot;parent_grant_id&quot;: &quot;fk3x9r2m5iv8&quot;,</text>
<text x="22" y="944" fill="#9aa4b4" xml:space="preserve">          &quot;permissions&quot;: [</text>
<text x="22" y="965" fill="#9aa4b4" xml:space="preserve">            &quot;hrms:payroll:payslip::read&quot;</text>
<text x="22" y="986" fill="#9aa4b4" xml:space="preserve">          ],</text>
<text x="22" y="1007" fill="#9aa4b4" xml:space="preserve">          &quot;scope&quot;: {</text>
<text x="22" y="1028" fill="#9aa4b4" xml:space="preserve">            &quot;cert&quot;: &quot;C17&quot;,</text>
<text x="22" y="1049" fill="#9aa4b4" xml:space="preserve">            &quot;dept&quot;: &quot;FIN&quot;</text>
<text x="22" y="1070" fill="#9aa4b4" xml:space="preserve">          }</text>
<text x="22" y="1091" fill="#9aa4b4" xml:space="preserve">        }</text>
<text x="22" y="1112" fill="#9aa4b4" xml:space="preserve">      ]</text>
<text x="22" y="1133" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1154" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="1196" fill="#d9a441" xml:space="preserve">══ WHO ASKS DOES NOT CHANGE WHAT IS HELD ══</text>
<text x="22" y="1217" fill="#4fb8e8">$</text>
<text x="38.8" y="1217" fill="#e8ecf2" xml:space="preserve">abv resolve --human fi7io4lvjqio --client agent_hrms --no-source</text>
<text x="22" y="1238" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1259" fill="#9aa4b4" xml:space="preserve">      &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1280" fill="#9aa4b4" xml:space="preserve">      &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="1301" fill="#9aa4b4" xml:space="preserve">      &quot;application_id&quot;: &quot;hrms&quot;,</text>
<text x="22" y="1322" fill="#9aa4b4" xml:space="preserve">      &quot;human_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1343" fill="#9aa4b4" xml:space="preserve">      &quot;resolved_grants&quot;: [</text>
<text x="22" y="1364" fill="#9aa4b4" xml:space="preserve">        {</text>
<text x="22" y="1385" fill="#9aa4b4" xml:space="preserve">          &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1406" fill="#9aa4b4" xml:space="preserve">          &quot;grant_id&quot;: &quot;fk3x9r2m5iv8&quot;,</text>
<text x="22" y="1427" fill="#9aa4b4" xml:space="preserve">          &quot;revision&quot;: 1,</text>
<text x="22" y="1448" fill="#9aa4b4" xml:space="preserve">          &quot;parent_grant_id&quot;: &quot;fk3x9r2m0dq3&quot;,</text>
<text x="22" y="1469" fill="#9aa4b4" xml:space="preserve">          &quot;permissions&quot;: [</text>
<text x="22" y="1490" fill="#9aa4b4" xml:space="preserve">            &quot;hrms:payroll:payslip::read&quot;,</text>
<text x="22" y="1511" fill="#9aa4b4" xml:space="preserve">            &quot;hrms:payroll:payslip::write&quot;</text>
<text x="22" y="1532" fill="#9aa4b4" xml:space="preserve">          ],</text>
<text x="22" y="1553" fill="#9aa4b4" xml:space="preserve">          &quot;scope&quot;: {</text>
<text x="22" y="1574" fill="#9aa4b4" xml:space="preserve">            &quot;dept&quot;: &quot;FIN&quot;</text>
<text x="22" y="1595" fill="#9aa4b4" xml:space="preserve">          }</text>
<text x="22" y="1616" fill="#9aa4b4" xml:space="preserve">        }</text>
<text x="22" y="1637" fill="#9aa4b4" xml:space="preserve">      ]</text>
<text x="22" y="1658" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1679" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="1721" fill="#d9a441" xml:space="preserve">══ REFUSALS ══</text>
<text x="22" y="1742" fill="#6b7687" xml:space="preserve">   (a credential this area does not know; and a human actor naming</text>
<text x="22" y="1763" fill="#9aa4b4" xml:space="preserve">    somebody else, which is impersonation rather than delegation)</text>
<text x="22" y="1805" fill="#4fb8e8">$</text>
<text x="38.8" y="1805" fill="#e8ecf2" xml:space="preserve">abv resolve --human fi7io4lvjqio --client agent_crm</text>
<text x="22" y="1826" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="22" y="1847" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="1889" fill="#4fb8e8">$</text>
<text x="38.8" y="1889" fill="#e8ecf2" xml:space="preserve">abv resolve --human fi7io4lvjwu8   (as a user actor — refused by the fixture gate)</text>
<text x="22" y="1910" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="22" y="1931" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="1973" fill="#d9a441" xml:space="preserve">══ THE ROWS ARE UNCHANGED — this moved a gate, not a record ══</text>
<text x="22" y="1994" fill="#9aa4b4" xml:space="preserve">╭────────────────┬──────╮</text>
<text x="22" y="2015" fill="#9aa4b4" xml:space="preserve">│      type      │ rows │</text>
<text x="22" y="2036" fill="#9aa4b4" xml:space="preserve">╞════════════════╪══════╡</text>
<text x="22" y="2057" fill="#9aa4b4" xml:space="preserve">│ assignment     │    3 │</text>
<text x="22" y="2078" fill="#9aa4b4" xml:space="preserve">│ catalog        │    1 │</text>
<text x="22" y="2099" fill="#9aa4b4" xml:space="preserve">│ grant          │    3 │</text>
<text x="22" y="2120" fill="#9aa4b4" xml:space="preserve">│ grant_revision │    3 │</text>
<text x="22" y="2141" fill="#9aa4b4" xml:space="preserve">│ membership     │    3 │</text>
<text x="22" y="2162" fill="#9aa4b4" xml:space="preserve">│ permission     │    3 │</text>
<text x="22" y="2183" fill="#9aa4b4" xml:space="preserve">│ role           │    1 │</text>
<text x="22" y="2204" fill="#9aa4b4" xml:space="preserve">│ scope          │    3 │</text>
<text x="22" y="2225" fill="#9aa4b4" xml:space="preserve">│ team           │    4 │</text>
<text x="22" y="2246" fill="#9aa4b4" xml:space="preserve">╰────────────────┴──────╯</text>
</svg>