<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1039" width="760" height="1039" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="760" height="1039" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h746a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="380.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — role · publish · get</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># a NEW role supplies no id. the service issues one and returns it.</text>
<text x="22" y="83" fill="#4fb8e8">$</text><text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv role publish --name payroll-approver --revision 1 \</text>
<text x="38.8" y="104" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="125" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="146" fill="#9aa4b4" xml:space="preserve">internal projection: role</text>
<text x="22" y="167" fill="#6cc292" xml:space="preserve">id  fy50rb4l143k          &lt;- issued, not chosen</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">name  payroll-approver</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">revision  1</text>
<text x="22" y="230" fill="#9aa4b4" xml:space="preserve">permissions  hrms:payroll:payslip::read</text>
<text x="22" y="251" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="272" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="293" fill="#6b7687" xml:space="preserve"># a caller cannot choose an id. one that names no role is refused,</text>
<text x="22" y="314" fill="#6b7687" xml:space="preserve"># so the only ways to hold an id are to be issued one or name one.</text>
<text x="22" y="335" fill="#4fb8e8">$</text><text x="38.8" y="335" fill="#e8ecf2" xml:space="preserve">abv role publish --id zzzzzzzz --name invented --revision 1 \</text>
<text x="38.8" y="356" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="377" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="398" fill="#e0787c" xml:space="preserve">operation rejected or record not found                        rc=3</text>
<text x="22" y="419" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="440" fill="#6b7687" xml:space="preserve"># --id names a role that exists: this is a new revision of it</text>
<text x="22" y="461" fill="#4fb8e8">$</text><text x="38.8" y="461" fill="#e8ecf2" xml:space="preserve">abv role publish --id fi9jvxobqsxs --name payslip-reader --revision 2 \</text>
<text x="38.8" y="482" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read,hrms:payroll:payslip::write \</text>
<text x="38.8" y="503" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="524" fill="#9aa4b4" xml:space="preserve">id  fi9jvxobqsxs   name  payslip-reader   revision  2</text>
<text x="22" y="545" fill="#9aa4b4" xml:space="preserve">permissions  hrms:payroll:payslip::read,hrms:payroll:payslip::write</text>
<text x="22" y="566" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="587" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="608" fill="#6b7687" xml:space="preserve"># add-only: a published revision is never rewritten</text>
<text x="22" y="629" fill="#4fb8e8">$</text><text x="38.8" y="629" fill="#e8ecf2" xml:space="preserve">abv role publish --id fi9jvxobqsxs --name payslip-reader --revision 2 \</text>
<text x="38.8" y="650" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="671" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="692" fill="#e0787c" xml:space="preserve">operation conflict                                            rc=4</text>
<text x="22" y="713" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="734" fill="#6b7687" xml:space="preserve"># a bundle cannot name a permission the catalog does not hold</text>
<text x="22" y="755" fill="#4fb8e8">$</text><text x="38.8" y="755" fill="#e8ecf2" xml:space="preserve">abv role publish --id fi9jvxobqsxs --name payslip-reader --revision 3 \</text>
<text x="38.8" y="776" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read,nosuch::verb \</text>
<text x="38.8" y="797" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="818" fill="#e0787c" xml:space="preserve">operation rejected or record not found                        rc=3</text>
<text x="22" y="839" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="860" fill="#6b7687" xml:space="preserve"># a read takes an exact revision. there is no latest here, by design.</text>
<text x="22" y="881" fill="#4fb8e8">$</text><text x="38.8" y="881" fill="#e8ecf2" xml:space="preserve">abv role get fi9jvxobqsxs --revision 1 \</text>
<text x="38.8" y="902" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="923" fill="#9aa4b4" xml:space="preserve">id  fi9jvxobqsxs   name  payslip-reader   revision  1</text>
<text x="22" y="944" fill="#9aa4b4" xml:space="preserve">permissions  hrms:payroll:payslip::read</text>
<text x="22" y="965" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="986" fill="#4fb8e8">$</text><text x="38.8" y="986" fill="#e8ecf2" xml:space="preserve">abv role get fi9jvxobqsxs --revision 3 \</text>
<text x="38.8" y="1007" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="1028" fill="#e0787c" xml:space="preserve">operation rejected or record not found                        rc=3</text>
</svg>