<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1123" width="800" height="1123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="800" height="1123" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h786a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="400.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — role · two publication paths</text>
<text x="22" y="62" fill="#9b8cd8" font-weight="600" xml:space="preserve">APPLICATION-MANAGED   published by the platform administrator</text>
<text x="22" y="83" fill="#6b7687" xml:space="preserve"># --application ships the role to every tenant. no id is supplied:</text>
<text x="22" y="104" fill="#6b7687" xml:space="preserve"># the service issues one, so nothing arbitrary enters the key path.</text>
<text x="22" y="125" fill="#4fb8e8">$</text><text x="38.8" y="125" fill="#e8ecf2" xml:space="preserve">abv role publish --application --name Viewer --revision 1 \</text>
<text x="38.8" y="146" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="167" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">internal projection: role</text>
<text x="22" y="209" fill="#9b8cd8" xml:space="preserve">id  fy52ef7ztla8          &lt;- issued, not chosen</text>
<text x="22" y="230" fill="#9aa4b4" xml:space="preserve">name  Viewer</text>
<text x="22" y="251" fill="#9b8cd8" xml:space="preserve">managed  application</text>
<text x="22" y="272" fill="#9aa4b4" xml:space="preserve">revision  1</text>
<text x="22" y="293" fill="#9aa4b4" xml:space="preserve">permissions  hrms:payroll:payslip::read</text>
<text x="22" y="314" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="335" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="356" fill="#9b8cd8" font-weight="600" xml:space="preserve">TENANT-MANAGED   published by a tenant administrator</text>
<text x="22" y="377" fill="#6b7687" xml:space="preserve"># no --application flag. the role belongs to the tenant publishing it,</text>
<text x="22" y="398" fill="#6b7687" xml:space="preserve"># composed from the same application vocabulary.</text>
<text x="22" y="419" fill="#4fb8e8">$</text><text x="38.8" y="419" fill="#e8ecf2" xml:space="preserve">abv role publish --name acme-payroll-approver --revision 1 \</text>
<text x="38.8" y="440" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read,hrms:payroll:payslip::write \</text>
<text x="38.8" y="461" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="482" fill="#6cc292" xml:space="preserve">id  fy52efa2qjnk</text>
<text x="22" y="503" fill="#9aa4b4" xml:space="preserve">name  acme-payroll-approver</text>
<text x="22" y="524" fill="#6cc292" xml:space="preserve">managed  tenant</text>
<text x="22" y="545" fill="#9aa4b4" xml:space="preserve">revision  1</text>
<text x="22" y="566" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="587" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="608" fill="#9b8cd8" font-weight="600" xml:space="preserve">A NEW REVISION OF EACH   --id names the role being extended</text>
<text x="22" y="629" fill="#4fb8e8">$</text><text x="38.8" y="629" fill="#e8ecf2" xml:space="preserve">abv role publish --application --id fy52ef7ztla8 --name Viewer --revision 2 \</text>
<text x="38.8" y="650" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read,hrms:payroll:payslip::write \</text>
<text x="38.8" y="671" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="692" fill="#9b8cd8" xml:space="preserve">id  fy52ef7ztla8   managed  application   revision  2         rc=0</text>
<text x="22" y="713" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="734" fill="#4fb8e8">$</text><text x="38.8" y="734" fill="#e8ecf2" xml:space="preserve">abv role publish --id fy52efa2qjnk --name acme-payroll-approver --revision 2 \</text>
<text x="38.8" y="755" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="776" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="797" fill="#6cc292" xml:space="preserve">id  fy52efa2qjnk   managed  tenant        revision  2         rc=0</text>
<text x="22" y="818" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="839" fill="#9b8cd8" font-weight="600" xml:space="preserve">THE BOUNDARY IS ENFORCED, NOT MERELY RECORDED</text>
<text x="22" y="860" fill="#6b7687" xml:space="preserve"># a tenant administrator may not revise a role the application ships —</text>
<text x="22" y="881" fill="#6b7687" xml:space="preserve"># it is the platform's property. a tenant wanting a different bundle</text>
<text x="22" y="902" fill="#6b7687" xml:space="preserve"># composes its own rather than editing someone else's.</text>
<text x="22" y="923" fill="#4fb8e8">$</text><text x="38.8" y="923" fill="#e8ecf2" xml:space="preserve">abv role publish --id fy52ef7ztla8 --name Viewer --revision 3 \</text>
<text x="38.8" y="944" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="965" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="986" fill="#e0787c" xml:space="preserve">operation rejected or record not found                             rc=3</text>
<text x="22" y="1007" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="1028" fill="#6b7687" xml:space="preserve"># and an id nobody issued is refused on either path</text>
<text x="22" y="1049" fill="#4fb8e8">$</text><text x="38.8" y="1049" fill="#e8ecf2" xml:space="preserve">abv role publish --id zzzzzzzz --name invented --revision 1 \</text>
<text x="38.8" y="1070" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="1091" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="1112" fill="#e0787c" xml:space="preserve">operation rejected or record not found                             rc=3</text>
</svg>