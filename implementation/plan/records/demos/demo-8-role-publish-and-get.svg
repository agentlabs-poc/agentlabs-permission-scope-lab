<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 619" width="700" height="619" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="700" height="619" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h686a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="350.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — role · publish · get</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># revision 1 is seeded by the fixture, so republishing it conflicts</text>
<text x="22" y="83" fill="#4fb8e8">$</text><text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv role publish fi9jvxobqsxs --name payslip-reader --revision 1 ...</text>
<text x="22" y="104" fill="#e0787c" xml:space="preserve">operation conflict                                        rc=4</text>
<text x="22" y="125" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="146" fill="#4fb8e8">$</text><text x="38.8" y="146" fill="#e8ecf2" xml:space="preserve">abv role publish fi9jvxobqsxs --name payslip-reader --revision 2 \</text>
<text x="22" y="167" fill="#4fb8e8">$</text><text x="38.8" y="167" fill="#e8ecf2" xml:space="preserve">    --permissions payslip::read,payslip::write</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">id  fi9jvxobqsxs</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">name  payslip-reader</text>
<text x="22" y="230" fill="#9aa4b4" xml:space="preserve">revision  2</text>
<text x="22" y="251" fill="#9aa4b4" xml:space="preserve">permissions  hrms:payroll:payslip::read,hrms:payroll:payslip::write</text>
<text x="22" y="272" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="293" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="314" fill="#6b7687" xml:space="preserve"># the id is a base-36 Snowflake. free text is not an id any more</text>
<text x="22" y="335" fill="#4fb8e8">$</text><text x="38.8" y="335" fill="#e8ecf2" xml:space="preserve">abv role publish payslip-reader --name x --revision 1 ...</text>
<text x="22" y="356" fill="#e0787c" xml:space="preserve">operation rejected or record not found                     rc=3</text>
<text x="22" y="377" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="398" fill="#6b7687" xml:space="preserve"># a bundle cannot name a permission the catalog does not hold</text>
<text x="22" y="419" fill="#4fb8e8">$</text><text x="38.8" y="419" fill="#e8ecf2" xml:space="preserve">abv role publish fi9jvxobqsxs ... --permissions payslip::read,nosuch::verb</text>
<text x="22" y="440" fill="#e0787c" xml:space="preserve">operation rejected or record not found                     rc=3</text>
<text x="22" y="461" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="482" fill="#6b7687" xml:space="preserve"># a read takes an exact revision. there is no latest here, by design</text>
<text x="22" y="503" fill="#4fb8e8">$</text><text x="38.8" y="503" fill="#e8ecf2" xml:space="preserve">abv role get fi9jvxobqsxs --revision 1</text>
<text x="22" y="524" fill="#9aa4b4" xml:space="preserve">id  fi9jvxobqsxs    name  payslip-reader    revision  1</text>
<text x="22" y="545" fill="#9aa4b4" xml:space="preserve">permissions  hrms:payroll:payslip::read</text>
<text x="22" y="566" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="587" fill="#4fb8e8">$</text><text x="38.8" y="587" fill="#e8ecf2" xml:space="preserve">abv role get fi9jvxobqsxs --revision 3</text>
<text x="22" y="608" fill="#e0787c" xml:space="preserve">operation rejected or record not found                     rc=3</text>
</svg>