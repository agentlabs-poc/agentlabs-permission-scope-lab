<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 976" width="780" height="976" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="780" height="976" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h766a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="390.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — role · publish · get</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># the application SHIPS a role to every tenant. no id is supplied:</text>
<text x="22" y="83" fill="#6b7687" xml:space="preserve"># the service issues one, so nothing arbitrary enters the key path.</text>
<text x="22" y="104" fill="#4fb8e8">$</text><text x="38.8" y="104" fill="#e8ecf2" xml:space="preserve">abv role publish --application --name Viewer --revision 1 \</text>
<text x="38.8" y="125" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="146" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="167" fill="#9aa4b4" xml:space="preserve">internal projection: role</text>
<text x="22" y="188" fill="#9b8cd8" xml:space="preserve">id  fy51x3hmku80          &lt;- issued, not chosen</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">name  Viewer</text>
<text x="22" y="230" fill="#9b8cd8" xml:space="preserve">managed  application</text>
<text x="22" y="251" fill="#9aa4b4" xml:space="preserve">revision  1</text>
<text x="22" y="272" fill="#9aa4b4" xml:space="preserve">permissions  hrms:payroll:payslip::read</text>
<text x="22" y="293" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="314" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="335" fill="#6b7687" xml:space="preserve"># a tenant COMPOSES its own, from the same vocabulary</text>
<text x="22" y="356" fill="#4fb8e8">$</text><text x="38.8" y="356" fill="#e8ecf2" xml:space="preserve">abv role publish --name acme-payroll-approver --revision 1 \</text>
<text x="38.8" y="377" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read,hrms:payroll:payslip::write \</text>
<text x="38.8" y="398" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="419" fill="#6cc292" xml:space="preserve">id  fy51x3iy0wsg    name  acme-payroll-approver</text>
<text x="22" y="440" fill="#6cc292" xml:space="preserve">managed  tenant      revision  1</text>
<text x="22" y="461" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="482" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="503" fill="#6b7687" xml:space="preserve"># a tenant may NOT revise a role the application ships — it is the</text>
<text x="22" y="524" fill="#6b7687" xml:space="preserve"># application's property. a tenant wanting a different bundle</text>
<text x="22" y="545" fill="#6b7687" xml:space="preserve"># composes its own rather than editing someone else's.</text>
<text x="22" y="566" fill="#4fb8e8">$</text><text x="38.8" y="566" fill="#e8ecf2" xml:space="preserve">abv role publish --id fy51x3hmku80 --name Viewer --revision 2 \</text>
<text x="38.8" y="587" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read,hrms:payroll:payslip::write \</text>
<text x="38.8" y="608" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="629" fill="#e0787c" xml:space="preserve">operation rejected or record not found                          rc=3</text>
<text x="22" y="650" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="671" fill="#6b7687" xml:space="preserve"># a caller cannot choose an id: one that names no role is refused.</text>
<text x="22" y="692" fill="#6b7687" xml:space="preserve"># the only two ways to hold an id: be issued one, or name one issued.</text>
<text x="22" y="713" fill="#4fb8e8">$</text><text x="38.8" y="713" fill="#e8ecf2" xml:space="preserve">abv role publish --id zzzzzzzz --name invented --revision 1 \</text>
<text x="38.8" y="734" fill="#e8ecf2" xml:space="preserve">    --permissions hrms:payroll:payslip::read \</text>
<text x="38.8" y="755" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="776" fill="#e0787c" xml:space="preserve">operation rejected or record not found                          rc=3</text>
<text x="22" y="797" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="818" fill="#6b7687" xml:space="preserve"># add-only, and a read takes an exact revision — never the latest</text>
<text x="22" y="839" fill="#4fb8e8">$</text><text x="38.8" y="839" fill="#e8ecf2" xml:space="preserve">abv role get fi9jvxobqsxs --revision 1 \</text>
<text x="38.8" y="860" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="881" fill="#9aa4b4" xml:space="preserve">id  fi9jvxobqsxs   name  payslip-reader   managed  tenant   revision  1</text>
<text x="22" y="902" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="923" fill="#4fb8e8">$</text><text x="38.8" y="923" fill="#e8ecf2" xml:space="preserve">abv role get fi9jvxobqsxs --revision 3 \</text>
<text x="38.8" y="944" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="965" fill="#e0787c" xml:space="preserve">operation rejected or record not found                          rc=3</text>
</svg>