<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1094 4054" width="1094" height="4054" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="1094" height="4054" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h1080a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="547.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">root establishment — two lineages, two ceilings, one tenant</text>
<text x="22" y="62" fill="#d9a441" xml:space="preserve">══ GENESIS — a tenant with teams and not one grant ══</text>
<text x="22" y="83" fill="#4fb8e8">$</text>
<text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv team list --roots --app hrms</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">    internal projection: teams</text>
<text x="22" y="125" fill="#9aa4b4" xml:space="preserve">    count  2</text>
<text x="22" y="146" fill="#9aa4b4" xml:space="preserve">    total  2</text>
<text x="22" y="167" fill="#9aa4b4" xml:space="preserve">    generation  0</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">    fibggi2jur5s  fp8h2w6ykxan       parent=(root)</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">    fibggi2jv0n4  AssignmentAdmins   parent=(root)</text>
<text x="22" y="230" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="272" fill="#4fb8e8">$</text>
<text x="38.8" y="272" fill="#e8ecf2" xml:space="preserve">abv grants list --app hrms</text>
<text x="22" y="293" fill="#9aa4b4" xml:space="preserve">    internal projection: grants</text>
<text x="22" y="314" fill="#9aa4b4" xml:space="preserve">    count  0</text>
<text x="22" y="335" fill="#9aa4b4" xml:space="preserve">    total  0</text>
<text x="22" y="356" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="398" fill="#d9a441" xml:space="preserve">══ ESTABLISHING IS NOT A GRANT OPERATION — Q-113 as vocabulary ══</text>
<text x="22" y="419" fill="#4fb8e8">$</text>
<text x="38.8" y="419" fill="#e8ecf2" xml:space="preserve">abv grants create --permissions hrms:payroll:payslip::read --scope dept=FIN --app hrms</text>
<text x="22" y="440" fill="#9aa4b4" xml:space="preserve">    grants create requires --parent: a parentless grant is not a root, and establishing one is not a grant operation</text>
<text x="22" y="461" fill="#e0787c" xml:space="preserve">    rc=2</text>
<text x="22" y="503" fill="#d9a441" xml:space="preserve">══ LINEAGE A — the Auth root, written from outside the tenant ══</text>
<text x="22" y="524" fill="#6b7687" xml:space="preserve">   (Q-114: an empty catalog computes an empty ceiling, and a ceiling of</text>
<text x="22" y="545" fill="#6b7687" xml:space="preserve">    nothing is not a ceiling. Registration precedes acceptance.)</text>
<text x="22" y="587" fill="#4fb8e8">$</text>
<text x="38.8" y="587" fill="#e8ecf2" xml:space="preserve">abv root establish-auth --team fibggi2jur5s --app auth</text>
<text x="22" y="608" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="22" y="629" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="671" fill="#4fb8e8">$</text>
<text x="38.8" y="671" fill="#e8ecf2" xml:space="preserve">abv catalog register-platform-permission auth:tenant:application::install --namespace auth</text>
<text x="22" y="692" fill="#9aa4b4" xml:space="preserve">    internal projection: permission</text>
<text x="22" y="713" fill="#9aa4b4" xml:space="preserve">    id  auth:tenant:application::install</text>
<text x="22" y="734" fill="#9aa4b4" xml:space="preserve">    namespace  auth</text>
<text x="22" y="755" fill="#9aa4b4" xml:space="preserve">    boundary  platform</text>
<text x="22" y="776" fill="#9aa4b4" xml:space="preserve">    active  true</text>
<text x="22" y="797" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="839" fill="#4fb8e8">$</text>
<text x="38.8" y="839" fill="#e8ecf2" xml:space="preserve">abv catalog register-platform-permission auth:grant::create --namespace auth</text>
<text x="22" y="860" fill="#9aa4b4" xml:space="preserve">    internal projection: permission</text>
<text x="22" y="881" fill="#9aa4b4" xml:space="preserve">    id  auth:grant::create</text>
<text x="22" y="902" fill="#9aa4b4" xml:space="preserve">    namespace  auth</text>
<text x="22" y="923" fill="#9aa4b4" xml:space="preserve">    boundary  platform</text>
<text x="22" y="944" fill="#9aa4b4" xml:space="preserve">    active  true</text>
<text x="22" y="965" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="1007" fill="#4fb8e8">$</text>
<text x="38.8" y="1007" fill="#e8ecf2" xml:space="preserve">abv root establish-auth --team fibggi2jur5s --app auth</text>
<text x="22" y="1028" fill="#9aa4b4" xml:space="preserve">    internal projection: grant</text>
<text x="22" y="1049" fill="#9aa4b4" xml:space="preserve">    id  fyb9ahvgyfpc</text>
<text x="22" y="1070" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="22" y="1091" fill="#9aa4b4" xml:space="preserve">    kind  root</text>
<text x="22" y="1112" fill="#9aa4b4" xml:space="preserve">    revision  1</text>
<text x="22" y="1133" fill="#9aa4b4" xml:space="preserve">    parent  (none — root)</text>
<text x="22" y="1154" fill="#9aa4b4" xml:space="preserve">    permissions  (computed from the catalog)</text>
<text x="22" y="1175" fill="#9aa4b4" xml:space="preserve">    scope  {} (adds no narrowing)</text>
<text x="22" y="1196" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="1238" fill="#4fb8e8">$</text>
<text x="38.8" y="1238" fill="#e8ecf2" xml:space="preserve">abv assignments list --grant fyb9ahvgyfpc --app auth</text>
<text x="22" y="1259" fill="#9aa4b4" xml:space="preserve">    internal projection: assignments</text>
<text x="22" y="1280" fill="#9aa4b4" xml:space="preserve">    count  1</text>
<text x="22" y="1301" fill="#9aa4b4" xml:space="preserve">    total  1</text>
<text x="22" y="1322" fill="#9aa4b4" xml:space="preserve">    fyb9ahvgyfpc   group  fibggi2jur5s   rev 1    enabled   fyb9ahvgyfpd</text>
<text x="22" y="1343" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="1385" fill="#4fb8e8">$</text>
<text x="38.8" y="1385" fill="#e8ecf2" xml:space="preserve">abv root establish-auth --team fibggi2jur5s --app auth</text>
<text x="22" y="1406" fill="#9aa4b4" xml:space="preserve">    operation conflict</text>
<text x="22" y="1427" fill="#e0787c" xml:space="preserve">    rc=4</text>
<text x="22" y="1469" fill="#d9a441" xml:space="preserve">══ LINEAGE B — the application root, written by the tenant administrator ══</text>
<text x="22" y="1490" fill="#6b7687" xml:space="preserve">   (A root is held by a top-level team. rootRoute refuses a parented</text>
<text x="22" y="1511" fill="#6b7687" xml:space="preserve">    holder at resolution; establishment refuses it at the write, so the</text>
<text x="22" y="1532" fill="#6b7687" xml:space="preserve">    record is never stored in a shape resolution would reject.)</text>
<text x="22" y="1574" fill="#4fb8e8">$</text>
<text x="38.8" y="1574" fill="#e8ecf2" xml:space="preserve">abv root establish --team fibggi2juubk --app hrms</text>
<text x="22" y="1595" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="22" y="1616" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="1658" fill="#4fb8e8">$</text>
<text x="38.8" y="1658" fill="#e8ecf2" xml:space="preserve">abv root establish --team fp8h2w6yzzzz --app hrms</text>
<text x="22" y="1679" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="22" y="1700" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="1742" fill="#4fb8e8">$</text>
<text x="38.8" y="1742" fill="#e8ecf2" xml:space="preserve">abv root establish --team not-a-snowflake --app hrms</text>
<text x="22" y="1763" fill="#9aa4b4" xml:space="preserve">    malformed input</text>
<text x="22" y="1784" fill="#e0787c" xml:space="preserve">    rc=2</text>
<text x="22" y="1826" fill="#4fb8e8">$</text>
<text x="38.8" y="1826" fill="#e8ecf2" xml:space="preserve">abv root establish --team fibggi2jur5s --app hrms</text>
<text x="22" y="1847" fill="#9aa4b4" xml:space="preserve">    internal projection: grant</text>
<text x="22" y="1868" fill="#9aa4b4" xml:space="preserve">    id  fyb9ai0y8f0g</text>
<text x="22" y="1889" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="22" y="1910" fill="#9aa4b4" xml:space="preserve">    kind  root</text>
<text x="22" y="1931" fill="#9aa4b4" xml:space="preserve">    revision  1</text>
<text x="22" y="1952" fill="#9aa4b4" xml:space="preserve">    parent  (none — root)</text>
<text x="22" y="1973" fill="#9aa4b4" xml:space="preserve">    permissions  (computed from the catalog)</text>
<text x="22" y="1994" fill="#9aa4b4" xml:space="preserve">    scope  {} (adds no narrowing)</text>
<text x="22" y="2015" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="2057" fill="#d9a441" xml:space="preserve">══ THE CATALOG IS NOT THE CEILING — decision 3, made visible ══</text>
<text x="22" y="2078" fill="#6b7687" xml:space="preserve">   (hrms&#x27;s catalog is its own permissions UNION every platform one, which</text>
<text x="22" y="2099" fill="#6b7687" xml:space="preserve">    is right for evaluation: a request inside hrms may legitimately need a</text>
<text x="22" y="2120" fill="#6b7687" xml:space="preserve">    platform permission. It is wrong for a ceiling. Creation checks the</text>
<text x="22" y="2141" fill="#6b7687" xml:space="preserve">    catalog; resolution checks the ceiling — so both children below are</text>
<text x="22" y="2162" fill="#6b7687" xml:space="preserve">    written, and only one of them resolves.)</text>
<text x="22" y="2204" fill="#4fb8e8">$</text>
<text x="38.8" y="2204" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions</text>
<text x="22" y="2225" fill="#9aa4b4" xml:space="preserve">    internal projection: permissions</text>
<text x="22" y="2246" fill="#9aa4b4" xml:space="preserve">    count  5</text>
<text x="22" y="2267" fill="#9aa4b4" xml:space="preserve">    total  5</text>
<text x="22" y="2288" fill="#9aa4b4" xml:space="preserve">    generation  2</text>
<text x="22" y="2309" fill="#9aa4b4" xml:space="preserve">    auth:grant::create  active=true</text>
<text x="22" y="2330" fill="#9aa4b4" xml:space="preserve">    auth:tenant:application::install  active=true</text>
<text x="22" y="2351" fill="#9aa4b4" xml:space="preserve">    hrms:payroll:payslip::delete  active=true</text>
<text x="22" y="2372" fill="#9aa4b4" xml:space="preserve">    hrms:payroll:payslip::read  active=true</text>
<text x="22" y="2393" fill="#9aa4b4" xml:space="preserve">    hrms:payroll:payslip::write  active=true</text>
<text x="22" y="2414" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="2456" fill="#4fb8e8">$</text>
<text x="38.8" y="2456" fill="#e8ecf2" xml:space="preserve">abv grants create --parent fyb9ai0y8f0g --permissions hrms:payroll:payslip::read --scope dept=FIN --app hrms</text>
<text x="22" y="2477" fill="#9aa4b4" xml:space="preserve">    internal projection: grant</text>
<text x="22" y="2498" fill="#9aa4b4" xml:space="preserve">    id  fyb9ai453qww</text>
<text x="22" y="2519" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="22" y="2540" fill="#9aa4b4" xml:space="preserve">    kind  child</text>
<text x="22" y="2561" fill="#9aa4b4" xml:space="preserve">    revision  1</text>
<text x="22" y="2582" fill="#9aa4b4" xml:space="preserve">    parent  fyb9ai0y8f0g</text>
<text x="22" y="2603" fill="#9aa4b4" xml:space="preserve">    permissions  hrms:payroll:payslip::read</text>
<text x="22" y="2624" fill="#9aa4b4" xml:space="preserve">    scope  dept=FIN</text>
<text x="22" y="2645" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="2687" fill="#4fb8e8">$</text>
<text x="38.8" y="2687" fill="#e8ecf2" xml:space="preserve">abv check assignment --file /tmp/abvdemo/proposal.json --app hrms</text>
<text x="22" y="2708" fill="#9aa4b4" xml:space="preserve">    READ-ONLY DIAGNOSIS: proposal is structurally and lineally valid; administrative and source authority are not established</text>
<text x="22" y="2729" fill="#9aa4b4" xml:space="preserve">    This does not authorize a later write.</text>
<text x="22" y="2750" fill="#9aa4b4" xml:space="preserve">    internal projection: proposed route</text>
<text x="22" y="2771" fill="#9aa4b4" xml:space="preserve">    field           value                       source</text>
<text x="22" y="2792" fill="#9aa4b4" xml:space="preserve">    grant_id        fyb9ai453qww                </text>
<text x="22" y="2813" fill="#9aa4b4" xml:space="preserve">    permissions     hrms:payroll:payslip::read  </text>
<text x="22" y="2834" fill="#9aa4b4" xml:space="preserve">    scope.dept      FIN                         fyb9ai453qww</text>
<text x="22" y="2855" fill="#9aa4b4" xml:space="preserve">    assignment_ids  fyb9ai0y8f0h                </text>
<text x="22" y="2876" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="2918" fill="#4fb8e8">$</text>
<text x="38.8" y="2918" fill="#e8ecf2" xml:space="preserve">abv grants create --parent fyb9ai0y8f0g --permissions auth:grant::create --app hrms</text>
<text x="22" y="2939" fill="#9aa4b4" xml:space="preserve">    internal projection: grant</text>
<text x="22" y="2960" fill="#9aa4b4" xml:space="preserve">    id  fyb9ai6ailmo</text>
<text x="22" y="2981" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="22" y="3002" fill="#9aa4b4" xml:space="preserve">    kind  child</text>
<text x="22" y="3023" fill="#9aa4b4" xml:space="preserve">    revision  1</text>
<text x="22" y="3044" fill="#9aa4b4" xml:space="preserve">    parent  fyb9ai0y8f0g</text>
<text x="22" y="3065" fill="#9aa4b4" xml:space="preserve">    permissions  auth:grant::create</text>
<text x="22" y="3086" fill="#9aa4b4" xml:space="preserve">    scope  {} (adds no narrowing)</text>
<text x="22" y="3107" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="3149" fill="#4fb8e8">$</text>
<text x="38.8" y="3149" fill="#e8ecf2" xml:space="preserve">abv check assignment --file /tmp/abvdemo/proposal.json --app hrms</text>
<text x="22" y="3170" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="22" y="3191" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="3233" fill="#d9a441" xml:space="preserve">══ THE SAME PERMISSION, THE OTHER ROOT ══</text>
<text x="22" y="3254" fill="#6b7687" xml:space="preserve">   (Identical request, identical permission, one area across. The route</text>
<text x="22" y="3275" fill="#6b7687" xml:space="preserve">    traces to the Auth root&#x27;s own assignment — the lineage the tenant</text>
<text x="22" y="3296" fill="#6b7687" xml:space="preserve">    administrator holds, which is not the one hrms bounds.)</text>
<text x="22" y="3338" fill="#4fb8e8">$</text>
<text x="38.8" y="3338" fill="#e8ecf2" xml:space="preserve">abv grants create --parent fyb9ahvgyfpc --permissions auth:grant::create --app auth</text>
<text x="22" y="3359" fill="#9aa4b4" xml:space="preserve">    internal projection: grant</text>
<text x="22" y="3380" fill="#9aa4b4" xml:space="preserve">    id  fyb9ai8axnnk</text>
<text x="22" y="3401" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="22" y="3422" fill="#9aa4b4" xml:space="preserve">    kind  child</text>
<text x="22" y="3443" fill="#9aa4b4" xml:space="preserve">    revision  1</text>
<text x="22" y="3464" fill="#9aa4b4" xml:space="preserve">    parent  fyb9ahvgyfpc</text>
<text x="22" y="3485" fill="#9aa4b4" xml:space="preserve">    permissions  auth:grant::create</text>
<text x="22" y="3506" fill="#9aa4b4" xml:space="preserve">    scope  {} (adds no narrowing)</text>
<text x="22" y="3527" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="3569" fill="#4fb8e8">$</text>
<text x="38.8" y="3569" fill="#e8ecf2" xml:space="preserve">abv check assignment --file /tmp/abvdemo/proposal.json --app auth</text>
<text x="22" y="3590" fill="#9aa4b4" xml:space="preserve">    READ-ONLY DIAGNOSIS: proposal is structurally and lineally valid; administrative and source authority are not established</text>
<text x="22" y="3611" fill="#9aa4b4" xml:space="preserve">    This does not authorize a later write.</text>
<text x="22" y="3632" fill="#9aa4b4" xml:space="preserve">    internal projection: proposed route</text>
<text x="22" y="3653" fill="#9aa4b4" xml:space="preserve">    field           value               source</text>
<text x="22" y="3674" fill="#9aa4b4" xml:space="preserve">    grant_id        fyb9ai8axnnk        </text>
<text x="22" y="3695" fill="#9aa4b4" xml:space="preserve">    permissions     auth:grant::create  </text>
<text x="22" y="3716" fill="#9aa4b4" xml:space="preserve">    assignment_ids  fyb9ahvgyfpd        </text>
<text x="22" y="3737" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="3779" fill="#d9a441" xml:space="preserve">══ THE ROWS — three records per root, one transaction ══</text>
<text x="22" y="3800" fill="#9aa4b4" xml:space="preserve">╭──────┬────────────────┬──────────────┬─────────────────────────────────────────────────────────────╮</text>
<text x="22" y="3821" fill="#9aa4b4" xml:space="preserve">│ area │      type      │      id      │                            value                            │</text>
<text x="22" y="3842" fill="#9aa4b4" xml:space="preserve">╞══════╪════════════════╪══════════════╪═════════════════════════════════════════════════════════════╡</text>
<text x="22" y="3863" fill="#9aa4b4" xml:space="preserve">│ hrms │ assignment     │ fyb9ai0y8f0g │ {&quot;id&quot;:&quot;fyb9ai0y8f0h&quot;,&quot;grant_revision&quot;:1,&quot;status&quot;:&quot;enabled&quot;} │</text>
<text x="22" y="3884" fill="#9aa4b4" xml:space="preserve">│ hrms │ grant          │ fyb9ai0y8f0g │ {&quot;status&quot;:&quot;enabled&quot;,&quot;trusted_root&quot;:true}                    │</text>
<text x="22" y="3905" fill="#9aa4b4" xml:space="preserve">│ hrms │ grant_revision │ fyb9ai0y8f0g │ {&quot;scope&quot;:{}}                                                │</text>
<text x="22" y="3926" fill="#9aa4b4" xml:space="preserve">│ auth │ assignment     │ fyb9ahvgyfpc │ {&quot;id&quot;:&quot;fyb9ahvgyfpd&quot;,&quot;grant_revision&quot;:1,&quot;status&quot;:&quot;enabled&quot;} │</text>
<text x="22" y="3947" fill="#9aa4b4" xml:space="preserve">│ auth │ grant          │ fyb9ahvgyfpc │ {&quot;status&quot;:&quot;enabled&quot;,&quot;trusted_root&quot;:true}                    │</text>
<text x="22" y="3968" fill="#9aa4b4" xml:space="preserve">│ auth │ grant_revision │ fyb9ahvgyfpc │ {&quot;scope&quot;:{}}                                                │</text>
<text x="22" y="3989" fill="#9aa4b4" xml:space="preserve">╰──────┴────────────────┴──────────────┴─────────────────────────────────────────────────────────────╯</text>
<text x="22" y="4031" fill="#9aa4b4" xml:space="preserve">  roots: auth=fyb9ahvgyfpc  hrms=fyb9ai0y8f0g</text>
