<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 619" width="780" height="619" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="780" height="619" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h766a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="390.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — role · list</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># one listing, both kinds — the catalog a tenant admin actually reads</text>
<text x="22" y="83" fill="#4fb8e8">$</text><text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv role list \</text>
<text x="38.8" y="104" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="125" fill="#9aa4b4" xml:space="preserve">count  3     total  3     generation  2</text>
<text x="22" y="146" fill="#9b8cd8" xml:space="preserve">fi9jvxobqsxs  rev=1  tenant       payslip-reader         payslip::read</text>
<text x="22" y="167" fill="#9b8cd8" xml:space="preserve">fy51x3hmku80  rev=1  application  Viewer                 payslip::read</text>
<text x="22" y="188" fill="#9b8cd8" xml:space="preserve">fy51x3iy0wsg  rev=1  tenant       acme-payroll-approver  payslip::read,::write</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">rc=0</text>
<text x="22" y="230" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="251" fill="#6b7687" xml:space="preserve"># narrowed to what the application ships</text>
<text x="22" y="272" fill="#4fb8e8">$</text><text x="38.8" y="272" fill="#e8ecf2" xml:space="preserve">abv role list --managed application \</text>
<text x="38.8" y="293" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="314" fill="#9aa4b4" xml:space="preserve">count  1     total  1     generation  2</text>
<text x="22" y="335" fill="#6cc292" xml:space="preserve">fy51x3hmku80  rev=1  application  Viewer  hrms:payroll:payslip::read</text>
<text x="22" y="356" fill="#9aa4b4" xml:space="preserve">rc=0</text>
<text x="22" y="377" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="398" fill="#6b7687" xml:space="preserve"># narrowed to what this tenant composed</text>
<text x="22" y="419" fill="#4fb8e8">$</text><text x="38.8" y="419" fill="#e8ecf2" xml:space="preserve">abv role list --managed tenant \</text>
<text x="38.8" y="440" fill="#e8ecf2" xml:space="preserve">--tenant acme --app hrms --db role.db --fixture-context maya-role-publisher</text>
<text x="22" y="461" fill="#9aa4b4" xml:space="preserve">count  2     total  2     generation  2</text>
<text x="22" y="482" fill="#6cc292" xml:space="preserve">fi9jvxobqsxs  rev=1  tenant  payslip-reader</text>
<text x="22" y="503" fill="#6cc292" xml:space="preserve">fy51x3iy0wsg  rev=1  tenant  acme-payroll-approver</text>
<text x="22" y="524" fill="#9aa4b4" xml:space="preserve">rc=0</text>
<text x="22" y="545" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="566" fill="#6b7687" xml:space="preserve"># --latest keeps the highest revision of each, computed as MAX(key5),</text>
<text x="22" y="587" fill="#6b7687" xml:space="preserve"># never stored. note total counts rows by default and roles here.</text>
<text x="22" y="608" fill="#6b7687" xml:space="preserve"># past the end: an empty page with a true total, never an error.</text>
</svg>