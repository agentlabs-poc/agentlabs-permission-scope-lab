<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 472" width="700" height="472" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="700" height="472" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h686a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="350.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — the role rows, read from the store</text>
<text x="22" y="62" fill="#9aa4b4" xml:space="preserve">boundary  tenant   key1 key2 key3  key4          key5        key6            revision</text>
<text x="22" y="83" fill="#9aa4b4" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────────────</text>
<text x="22" y="104" fill="#d9a441" xml:space="preserve">tenant    [acme]   abv  role hrms  fi9jvxobqsxs  0000000001  payslip-reader         0</text>
<text x="22" y="125" fill="#d9a441" xml:space="preserve">tenant    [acme]   abv  role hrms  fi9jvxobqsxs  0000000002  payslip-reader         0</text>
<text x="22" y="146" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="167" fill="#9aa4b4" xml:space="preserve">value</text>
<text x="22" y="188" fill="#6cc292" xml:space="preserve">  {&quot;permissions&quot;:[&quot;hrms:payroll:payslip::read&quot;]}</text>
<text x="22" y="209" fill="#6cc292" xml:space="preserve">  {&quot;permissions&quot;:[&quot;hrms:payroll:payslip::read&quot;,&quot;hrms:payroll:payslip::write&quot;]}</text>
<text x="22" y="230" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="251" fill="#6b7687" xml:space="preserve"># key5 is the revision, zero-padded — a slot is TEXT, so &quot;10&quot; would</text>
<text x="22" y="272" fill="#6b7687" xml:space="preserve"># sort before &quot;2&quot;. padding makes ORDER BY key5 equal numeric order.</text>
<text x="22" y="293" fill="#6b7687" xml:space="preserve"># two revisions differ only there, which is why both rows survive:</text>
<text x="22" y="314" fill="#6b7687" xml:space="preserve"># identity is the key path, so the revision has to live inside it.</text>
<text x="22" y="335" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="356" fill="#6b7687" xml:space="preserve"># key6 is the name — a label, not a handle. it is not unique.</text>
<text x="22" y="377" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="398" fill="#e0787c" xml:space="preserve">revision column = 0 for every role — it is drift from the frozen 123</text>
<text x="22" y="419" fill="#e0787c" xml:space="preserve">envelope (tenant | key1..key10 | value | ts | state) and is to be removed</text>
<text x="22" y="440" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="461" fill="#9aa4b4" xml:space="preserve">the roles table is gone:  tables 11 -&gt; 10</text>
</svg>