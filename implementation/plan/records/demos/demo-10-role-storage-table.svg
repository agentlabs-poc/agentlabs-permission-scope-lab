<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 556" width="780" height="556" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="780" height="556" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h766a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="390.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — the role rows, read from the store</text>
<text x="22" y="62" fill="#9aa4b4" xml:space="preserve"> boundary    tenant_id  key3      key4         key5             key6</text>
<text x="22" y="83" fill="#9aa4b4" xml:space="preserve">───────────────────────────────────────────────────────────────────────────────</text>
<text x="22" y="104" fill="#9b8cd8" xml:space="preserve">application             hrms  fy51x3hmku80  0000000001  Viewer</text>
<text x="22" y="125" fill="#d9a441" xml:space="preserve">tenant       acme       hrms  fi9jvxobqsxs  0000000001  payslip-reader</text>
<text x="22" y="146" fill="#d9a441" xml:space="preserve">tenant       acme       hrms  fy51x3iy0wsg  0000000001  acme-payroll-approver</text>
<text x="22" y="167" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="188" fill="#6b7687" xml:space="preserve"># THE BOUNDARY IS THE WHOLE DIFFERENCE. same key path, same payload,</text>
<text x="22" y="209" fill="#6b7687" xml:space="preserve"># same validation — one carries a tenant, the other does not. one read</text>
<text x="22" y="230" fill="#6b7687" xml:space="preserve"># returns both, which is the catalog a tenant administrator reads.</text>
<text x="22" y="251" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="272" fill="#6b7687" xml:space="preserve"># two revisions of one role differ ONLY in key5, and both survive.</text>
<text x="22" y="293" fill="#6b7687" xml:space="preserve"># identity is the key path, so the revision has to live inside it —</text>
<text x="22" y="314" fill="#6b7687" xml:space="preserve"># in the value, revision 2 would collide with revision 1.</text>
<text x="22" y="335" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="356" fill="#6b7687" xml:space="preserve"># key5 is zero-padded: a slot is TEXT, so &quot;10&quot; would sort before &quot;2&quot;.</text>
<text x="22" y="377" fill="#6b7687" xml:space="preserve"># a caller never sees it — the contract carries an int64.</text>
<text x="22" y="398" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="419" fill="#6b7687" xml:space="preserve"># key4 is a base-36 Snowflake, issued by the service. key6 is the</text>
<text x="22" y="440" fill="#6b7687" xml:space="preserve"># name: a label, not a handle, and deliberately not unique.</text>
<text x="22" y="461" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="482" fill="#e0787c" xml:space="preserve">the revision column is 0 for every role. it is drift from the frozen 123</text>
<text x="22" y="503" fill="#e0787c" xml:space="preserve">envelope — tenant | key1..key10 | value | ts | state — and is to be removed.</text>
<text x="22" y="524" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="545" fill="#9aa4b4" xml:space="preserve">the roles table is folded away:  tables 11 -&gt; 10</text>
</svg>