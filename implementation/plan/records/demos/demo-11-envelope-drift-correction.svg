<text x="18" y="60" fill="#d9a441" xml:space="preserve">══ THE RULE: a permission&#x27;s first noun IS its application ══</text>
<text x="18" y="80" fill="#4fb8e8" xml:space="preserve">$ abv hrms:employee:certificate::read --app hrms --db drift.db --fixture-context application-publisher</text>
<text x="18" y="100" fill="#9aa4b4" xml:space="preserve">    internal projection: permission</text>
<text x="18" y="120" fill="#9aa4b4" xml:space="preserve">    id  hrms:employee:certificate::read</text>
<text x="18" y="140" fill="#9aa4b4" xml:space="preserve">    active  true</text>
<text x="18" y="160" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="180" fill="#4fb8e8" xml:space="preserve">$ abv billing:invoice::read --app hrms --db drift.db --fixture-context application-publisher</text>
<text x="18" y="200" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="18" y="220" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="240" fill="#4fb8e8" xml:space="preserve">$ abv reporting:ledger:entry::export --app hrms --db drift.db --fixture-context application-publisher</text>
<text x="18" y="260" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="18" y="280" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="300" fill="#9aa4b4" xml:space="preserve"></text>
