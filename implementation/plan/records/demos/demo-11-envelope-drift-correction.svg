<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 997" width="800" height="997" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="800" height="997" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h786a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="400.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — the envelope, corrected</text>
<text x="22" y="62" fill="#d9a441" xml:space="preserve">BEFORE                                    AFTER</text>
<text x="22" y="83" fill="#e0787c" xml:space="preserve">boundary          &lt;- drift</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">tenant_id                                 tenant_id</text>
<text x="22" y="125" fill="#e0787c" xml:space="preserve">application_id    &lt;- drift</text>
<text x="22" y="146" fill="#9aa4b4" xml:space="preserve">key1 … key10                              key1 … key10</text>
<text x="22" y="167" fill="#e0787c" xml:space="preserve">revision          &lt;- drift</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">value                                     value</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">ts                                        ts</text>
<text x="22" y="230" fill="#9aa4b4" xml:space="preserve">state                                     state</text>
<text x="22" y="251" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="272" fill="#6cc292" xml:space="preserve">                                          = the frozen 123 shape, exactly</text>
<text x="22" y="293" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="314" fill="#6b7687" xml:space="preserve"># every record type, one shape. key3 is the application in all of them.</text>
<text x="22" y="335" fill="#9aa4b4" xml:space="preserve">tenant  key1  key2        key3  key4          key5        key6            key10</text>
<text x="22" y="356" fill="#9aa4b4" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────────</text>
<text x="22" y="377" fill="#9aa4b4" xml:space="preserve">(none)  abv   permission  hrms  hrms          employee    certificate     read</text>
<text x="22" y="398" fill="#9aa4b4" xml:space="preserve">(none)  abv   permission  hrms  hrms          payroll     payslip         write</text>
<text x="22" y="419" fill="#9b8cd8" xml:space="preserve">acme    abv   role        hrms  fi9jvxobqsxs  0000000001  payslip-reader</text>
<text x="22" y="440" fill="#9b8cd8" xml:space="preserve">(none)  abv   role        hrms  fy56o6p9tfcw  0000000001  Viewer</text>
<text x="22" y="461" fill="#6cc292" xml:space="preserve">(none)  abv   scope       hrms  dept</text>
<text x="22" y="482" fill="#6cc292" xml:space="preserve">(none)  abv   scope       hrms  region</text>
<text x="22" y="503" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="524" fill="#9aa4b4" xml:space="preserve">  key2         rows  distinct key3</text>
<text x="22" y="545" fill="#9aa4b4" xml:space="preserve">  permission      4              1   hrms</text>
<text x="22" y="566" fill="#9aa4b4" xml:space="preserve">  role            2              1   hrms</text>
<text x="22" y="587" fill="#9aa4b4" xml:space="preserve">  scope           4              1   hrms</text>
<text x="22" y="608" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="629" fill="#6b7687" xml:space="preserve"># THIS is why application_id could go: key3 already answers "which</text>
<text x="22" y="650" fill="#6b7687" xml:space="preserve"># application owns this row", for every record type, by construction.</text>
<text x="22" y="671" fill="#6b7687" xml:space="preserve">#</text>
<text x="22" y="692" fill="#6b7687" xml:space="preserve"># it had to become true of permissions first. their key3 used to hold the</text>
<text x="22" y="713" fill="#6b7687" xml:space="preserve"># LEADING NOUN, which is not guaranteed to be the application — so two</text>
<text x="22" y="734" fill="#6b7687" xml:space="preserve"># applications registering billing:invoice::read would have produced an</text>
<text x="22" y="755" fill="#6b7687" xml:space="preserve"># identical key path and collided. permissions now write the application</text>
<text x="22" y="776" fill="#6b7687" xml:space="preserve"># into key3 and start their noun path at key4. six noun slots, not seven.</text>
<text x="22" y="797" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="818" fill="#6b7687" xml:space="preserve"># an empty tenant now carries what boundary used to say, and a revisioned</text>
<text x="22" y="839" fill="#6b7687" xml:space="preserve"># record carries its revision in a slot — key5, zero-padded, for a role.</text>
<text x="22" y="860" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="881" fill="#e0787c" xml:space="preserve">  boundary        gone</text>
<text x="22" y="902" fill="#e0787c" xml:space="preserve">  application_id  gone</text>
<text x="22" y="923" fill="#e0787c" xml:space="preserve">  revision        gone</text>
<text x="22" y="944" fill="#6b7687" xml:space="preserve"></text>
<text x="22" y="965" fill="#6cc292" xml:space="preserve"># and the rendered canonical string is still NOT stored. the slots are the</text>
<text x="22" y="986" fill="#6cc292" xml:space="preserve"># truth; one renderer, in Go, at the boundary. nothing else spells it.</text>
</svg>