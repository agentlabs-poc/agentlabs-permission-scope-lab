<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 631" width="615" height="631" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="615" height="631" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h601a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="307.5" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — scope · list · offset paging</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># ordered by key, with total and the catalog generation</text>
<text x="22" y="83" fill="#4fb8e8">$</text>
<text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv catalog list-scopes</text>
<text x="22" y="104" fill="#d9a441" xml:space="preserve">count  4     total  4     generation  1</text>
<text x="22" y="125" fill="#9aa4b4" xml:space="preserve">cert</text>
<text x="22" y="146" fill="#9aa4b4" xml:space="preserve">dept</text>
<text x="22" y="167" fill="#9aa4b4" xml:space="preserve">region</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">user</text>
<text x="22" y="230" fill="#6b7687" xml:space="preserve"># offset paging. no prefix filter: a scope key is a flat token, so a</text>
<text x="22" y="251" fill="#6b7687" xml:space="preserve"># prefix would be a string match inside one slot</text>
<text x="22" y="272" fill="#4fb8e8">$</text>
<text x="38.8" y="272" fill="#e8ecf2" xml:space="preserve">abv catalog list-scopes --limit 2</text>
<text x="22" y="293" fill="#d9a441" xml:space="preserve">count  2     total  4     generation  1</text>
<text x="22" y="314" fill="#9aa4b4" xml:space="preserve">cert</text>
<text x="22" y="335" fill="#9aa4b4" xml:space="preserve">dept</text>
<text x="22" y="377" fill="#4fb8e8">$</text>
<text x="38.8" y="377" fill="#e8ecf2" xml:space="preserve">abv catalog list-scopes --offset 2 --limit 2</text>
<text x="22" y="398" fill="#d9a441" xml:space="preserve">count  2     total  4     generation  1</text>
<text x="22" y="419" fill="#9aa4b4" xml:space="preserve">region</text>
<text x="22" y="440" fill="#9aa4b4" xml:space="preserve">user</text>
<text x="22" y="482" fill="#6b7687" xml:space="preserve"># past the end is an empty page, not an error</text>
<text x="22" y="503" fill="#4fb8e8">$</text>
<text x="38.8" y="503" fill="#e8ecf2" xml:space="preserve">abv catalog list-scopes --offset 99</text>
<text x="22" y="524" fill="#9aa4b4" xml:space="preserve">count  0     total  4     generation  1</text>
<text x="22" y="566" fill="#6b7687" xml:space="preserve"># the page size is capped</text>
<text x="22" y="587" fill="#4fb8e8">$</text>
<text x="38.8" y="587" fill="#e8ecf2" xml:space="preserve">abv catalog list-scopes --limit 9999</text>
<text x="22" y="608" fill="#e0787c" xml:space="preserve">malformed input                              rc=2</text>
</svg>