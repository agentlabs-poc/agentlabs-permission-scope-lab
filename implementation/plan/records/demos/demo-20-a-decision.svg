<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1077 3235" width="1077" height="3235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="1077" height="3235" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h1063a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="538.5" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">a decision — what every record exists to produce</text>
<text x="22" y="62" fill="#d9a441" xml:space="preserve">══ THE CHAIN AUTHORITY TRAVELS ══</text>
<text x="22" y="83" fill="#6b7687" xml:space="preserve">   (the root bounds the area; Team1&#x27;s grant narrows it to Finance; Team2&#x27;s</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">    narrows again to one certificate. maya is in Team1, nutan in Team2.)</text>
<text x="22" y="146" fill="#4fb8e8">$</text>
<text x="38.8" y="146" fill="#e8ecf2" xml:space="preserve">abv grants list</text>
<text x="22" y="167" fill="#9aa4b4" xml:space="preserve">    internal projection: grants</text>
<text x="22" y="188" fill="#9aa4b4" xml:space="preserve">    count  3</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">    total  3</text>
<text x="22" y="230" fill="#9aa4b4" xml:space="preserve">    fk3x9r2m0dq3   enabled   root</text>
<text x="22" y="251" fill="#9aa4b4" xml:space="preserve">    fk3x9r2m5iv8   enabled   child</text>
<text x="22" y="272" fill="#9aa4b4" xml:space="preserve">    fk3x9r2man0d   enabled   child</text>
<text x="22" y="293" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="335" fill="#d9a441" xml:space="preserve">══ ALLOWED — and on whose authority ══</text>
<text x="22" y="356" fill="#6b7687" xml:space="preserve">   (grant_ids is the chain, root first. This is the whole point of every</text>
<text x="22" y="377" fill="#6b7687" xml:space="preserve">    record: a human asked, and the answer came back with its evidence.)</text>
<text x="22" y="419" fill="#4fb8e8">$</text>
<text x="38.8" y="419" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjqio --permission hrms:payroll:payslip::read --boundary dept=FIN</text>
<text x="22" y="440" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="461" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="482" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;allow&quot;,</text>
<text x="22" y="503" fill="#9aa4b4" xml:space="preserve">        &quot;grant_ids&quot;: [</text>
<text x="22" y="524" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2m0dq3&quot;,</text>
<text x="22" y="545" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2m5iv8&quot;</text>
<text x="22" y="566" fill="#9aa4b4" xml:space="preserve">        ]</text>
<text x="22" y="587" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="608" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="650" fill="#d9a441" xml:space="preserve">══ DENIED OUTSIDE THE BOUNDARY ══</text>
<text x="22" y="671" fill="#6b7687" xml:space="preserve">   (same human, same permission, one value changed. The deny carries two</text>
<text x="22" y="692" fill="#9aa4b4" xml:space="preserve">    messages: one for the person, one for the operator — Q-053.)</text>
<text x="22" y="734" fill="#4fb8e8">$</text>
<text x="38.8" y="734" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjqio --permission hrms:payroll:payslip::read --boundary dept=ENG</text>
<text x="22" y="755" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="776" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="797" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="818" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="839" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="860" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="881" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="902" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="944" fill="#d9a441" xml:space="preserve">══ A DEEPER ROUTE NEEDS EVERY PREDICATE ══</text>
<text x="22" y="965" fill="#6b7687" xml:space="preserve">   (nutan reaches the same permission through one more hop, so her route</text>
<text x="22" y="986" fill="#9aa4b4" xml:space="preserve">    carries both narrowings. Finance alone is not enough; the chain is</text>
<text x="22" y="1007" fill="#9aa4b4" xml:space="preserve">    three grants rather than two, and the ids say so.)</text>
<text x="22" y="1049" fill="#4fb8e8">$</text>
<text x="38.8" y="1049" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjwu8 --permission hrms:payroll:payslip::read --boundary dept=FIN --boundary cert=C17</text>
<text x="22" y="1070" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1091" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1112" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;allow&quot;,</text>
<text x="22" y="1133" fill="#9aa4b4" xml:space="preserve">        &quot;grant_ids&quot;: [</text>
<text x="22" y="1154" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2m0dq3&quot;,</text>
<text x="22" y="1175" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2m5iv8&quot;,</text>
<text x="22" y="1196" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2man0d&quot;</text>
<text x="22" y="1217" fill="#9aa4b4" xml:space="preserve">        ]</text>
<text x="22" y="1238" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1259" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="1301" fill="#4fb8e8">$</text>
<text x="38.8" y="1301" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjwu8 --permission hrms:payroll:payslip::read --boundary dept=FIN --boundary cert=C18</text>
<text x="22" y="1322" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1343" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1364" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="1385" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="1406" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="1427" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="1448" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1469" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="1511" fill="#d9a441" xml:space="preserve">══ SELECTED, NOT INHERITED — the asymmetry, at a decision ══</text>
<text x="22" y="1532" fill="#6b7687" xml:space="preserve">   (Team1 holds read AND write. Team2&#x27;s grant selects read only, so nutan</text>
<text x="22" y="1553" fill="#9aa4b4" xml:space="preserve">    cannot write where maya can — permissions are chosen by each child,</text>
<text x="22" y="1574" fill="#9aa4b4" xml:space="preserve">    while scope is inherited and narrowed.)</text>
<text x="22" y="1616" fill="#4fb8e8">$</text>
<text x="38.8" y="1616" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjqio --permission hrms:payroll:payslip::write --boundary dept=FIN</text>
<text x="22" y="1637" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1658" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1679" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;allow&quot;,</text>
<text x="22" y="1700" fill="#9aa4b4" xml:space="preserve">        &quot;grant_ids&quot;: [</text>
<text x="22" y="1721" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2m0dq3&quot;,</text>
<text x="22" y="1742" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2m5iv8&quot;</text>
<text x="22" y="1763" fill="#9aa4b4" xml:space="preserve">        ]</text>
<text x="22" y="1784" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1805" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="1847" fill="#4fb8e8">$</text>
<text x="38.8" y="1847" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjwu8 --permission hrms:payroll:payslip::write --boundary dept=FIN --boundary cert=C17</text>
<text x="22" y="1868" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1889" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1910" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="1931" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="1952" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="1973" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="1994" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="2015" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="2057" fill="#d9a441" xml:space="preserve">══ ALL-VALUES DENIES RATHER THAN DERIVING A SUBSET — Q-071 ══</text>
<text x="22" y="2078" fill="#6b7687" xml:space="preserve">   (asking for every department is not a request for the ones she may see.)</text>
<text x="22" y="2120" fill="#4fb8e8">$</text>
<text x="38.8" y="2120" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjqio --permission hrms:payroll:payslip::read --all dept</text>
<text x="22" y="2141" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="2162" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="2183" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="2204" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="2225" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="2246" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="2267" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="2288" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="22" y="2330" fill="#d9a441" xml:space="preserve">══ $self — ONE GRANT, A DIFFERENT REACH FOR EACH PERSON ══</text>
<text x="22" y="2351" fill="#6b7687" xml:space="preserve">   (SELF-001, and GROUP-004 calls it the preferred practice: one</text>
<text x="22" y="2372" fill="#9aa4b4" xml:space="preserve">    self-service grant to a group instead of one grant per employee.</text>
<text x="22" y="2393" fill="#9aa4b4" xml:space="preserve">    The scope rule is shared; the reach is specific to whoever asks.)</text>
<text x="22" y="2435" fill="#4fb8e8">$</text>
<text x="38.8" y="2435" fill="#e8ecf2" xml:space="preserve">abv grants create --parent fk3x9r2m5iv8 --permissions hrms:payroll:payslip::read --scope user=$self</text>
<text x="22" y="2456" fill="#9aa4b4" xml:space="preserve">    internal projection: grant</text>
<text x="22" y="2477" fill="#9aa4b4" xml:space="preserve">    id  fyc64qen9r0g</text>
<text x="22" y="2498" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="22" y="2519" fill="#9aa4b4" xml:space="preserve">    kind  child</text>
<text x="22" y="2540" fill="#9aa4b4" xml:space="preserve">    revision  1</text>
<text x="22" y="2561" fill="#9aa4b4" xml:space="preserve">    parent  fk3x9r2m5iv8</text>
<text x="22" y="2582" fill="#9aa4b4" xml:space="preserve">    permissions  hrms:payroll:payslip::read</text>
<text x="22" y="2603" fill="#9aa4b4" xml:space="preserve">    scope  user=$self</text>
<text x="22" y="2624" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="2666" fill="#4fb8e8">$</text>
<text x="38.8" y="2666" fill="#e8ecf2" xml:space="preserve">abv assign --file self.json   (to Team2, the group)</text>
<text x="22" y="2687" fill="#9aa4b4" xml:space="preserve">    assignment fm5b7t4pslf1 created</text>
<text x="22" y="2708" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="2750" fill="#6b7687" xml:space="preserve">   (nutan is in Team2. The token resolves to her — and to nobody else.)</text>
<text x="22" y="2792" fill="#4fb8e8">$</text>
<text x="38.8" y="2792" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjwu8 --permission hrms:payroll:payslip::read --boundary dept=FIN --boundary user=fi7io4lvjwu8</text>
<text x="22" y="2813" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="2834" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="2855" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;allow&quot;,</text>
<text x="22" y="2876" fill="#9aa4b4" xml:space="preserve">        &quot;grant_ids&quot;: [</text>
<text x="22" y="2897" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2m0dq3&quot;,</text>
<text x="22" y="2918" fill="#9aa4b4" xml:space="preserve">            &quot;fk3x9r2m5iv8&quot;,</text>
<text x="22" y="2939" fill="#9aa4b4" xml:space="preserve">            &quot;fyc64qen9r0g&quot;</text>
<text x="22" y="2960" fill="#9aa4b4" xml:space="preserve">        ]</text>
<text x="22" y="2981" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="3002" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="22" y="3044" fill="#4fb8e8">$</text>
<text x="38.8" y="3044" fill="#e8ecf2" xml:space="preserve">auth-evaluate --human fi7io4lvjwu8 --permission hrms:payroll:payslip::read --boundary dept=FIN --boundary user=fi7io4lvjqio</text>
<text x="22" y="3065" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="3086" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="3107" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="3128" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="3149" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="3170" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="3191" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="3212" fill="#e0787c" xml:space="preserve">    rc=3</text>
</svg>