<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 819 2739" width="819" height="2739" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="819" height="2739" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h805a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="409.5" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">two processes — the gate on the client, the records in Auth</text>
<text x="22" y="62" fill="#d9a441" xml:space="preserve">══ TWO PROCESSES ══</text>
<text x="22" y="83" fill="#6b7687" xml:space="preserve">   (the Auth service holds the records. The application holds none —</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">    it is given a URL where it used to be given a database path.)</text>
<text x="22" y="146" fill="#4fb8e8">$</text>
<text x="38.8" y="146" fill="#e8ecf2" xml:space="preserve">auth-service --authority authority.db --registry registry.db --listen 127.0.0.1:8080</text>
<text x="22" y="167" fill="#9aa4b4" xml:space="preserve">    auth-service listening on 127.0.0.1:8080 for acme/hrms</text>
<text x="22" y="209" fill="#4fb8e8">$</text>
<text x="38.8" y="209" fill="#e8ecf2" xml:space="preserve">hrms --auth http://127.0.0.1:8080 --listen 127.0.0.1:8081 --client agent_hrms</text>
<text x="22" y="230" fill="#9aa4b4" xml:space="preserve">    hrms listening on 127.0.0.1:8081, asking http://127.0.0.1:8080 as agent_hrms</text>
<text x="22" y="272" fill="#d9a441" xml:space="preserve">══ THE REQUEST REACHES THE HANDLER, OR IT DOES NOT ══</text>
<text x="22" y="293" fill="#6b7687" xml:space="preserve">   (maya holds payslip read and write within dept=FIN)</text>
<text x="22" y="335" fill="#4fb8e8">$</text>
<text x="38.8" y="335" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/FIN/C17                             (inside her boundary)</text>
<text x="22" y="356" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="377" fill="#9aa4b4" xml:space="preserve">        &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="398" fill="#9aa4b4" xml:space="preserve">        &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="419" fill="#9aa4b4" xml:space="preserve">        &quot;certificate_id&quot;: &quot;C17&quot;,</text>
<text x="22" y="440" fill="#9aa4b4" xml:space="preserve">        &quot;employee_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="461" fill="#9aa4b4" xml:space="preserve">        &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="482" fill="#9aa4b4" xml:space="preserve">        &quot;title&quot;: &quot;FIN annual&quot;</text>
<text x="22" y="503" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="524" fill="#6cc292" xml:space="preserve">    200</text>
<text x="22" y="566" fill="#4fb8e8">$</text>
<text x="38.8" y="566" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/ENG/C18                             (outside it)</text>
<text x="22" y="587" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="608" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="629" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="650" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="671" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="692" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="713" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="734" fill="#e0787c" xml:space="preserve">    403</text>
<text x="22" y="776" fill="#d9a441" xml:space="preserve">══ SAME ENDPOINT, SAME POLICY, TWO PEOPLE ══</text>
<text x="22" y="797" fill="#6b7687" xml:space="preserve">   (Team1&#x27;s grant carries read AND write. Team2&#x27;s child selects read</text>
<text x="22" y="818" fill="#9aa4b4" xml:space="preserve">    only — so nutan reaches the same endpoint and is refused. Permissions</text>
<text x="22" y="839" fill="#9aa4b4" xml:space="preserve">    are chosen by each child; scope is inherited and narrowed.)</text>
<text x="22" y="881" fill="#4fb8e8">$</text>
<text x="38.8" y="881" fill="#e8ecf2" xml:space="preserve">curl -X PUT  /api/v1/acme/certificates/C17                    (maya may write)</text>
<text x="22" y="902" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="923" fill="#9aa4b4" xml:space="preserve">        &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="944" fill="#9aa4b4" xml:space="preserve">        &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="965" fill="#9aa4b4" xml:space="preserve">        &quot;certificate_id&quot;: &quot;C17&quot;,</text>
<text x="22" y="986" fill="#9aa4b4" xml:space="preserve">        &quot;employee_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1007" fill="#9aa4b4" xml:space="preserve">        &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1028" fill="#9aa4b4" xml:space="preserve">        &quot;title&quot;: &quot;revised&quot;</text>
<text x="22" y="1049" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1070" fill="#6cc292" xml:space="preserve">    200</text>
<text x="22" y="1112" fill="#4fb8e8">$</text>
<text x="38.8" y="1112" fill="#e8ecf2" xml:space="preserve">curl -X PUT  /api/v1/acme/certificates/C17                    (nutan may not)</text>
<text x="22" y="1133" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1154" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1175" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="1196" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="1217" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="1238" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="1259" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1280" fill="#e0787c" xml:space="preserve">    403</text>
<text x="22" y="1322" fill="#d9a441" xml:space="preserve">══ A THIRD ENDPOINT, AND AN ALL-VALUES ASK ══</text>
<text x="22" y="1343" fill="#6b7687" xml:space="preserve">   (the listing endpoint names no department, so it asks for every one.</text>
<text x="22" y="1364" fill="#9aa4b4" xml:space="preserve">    Q-071: that is a deny, not a quiet narrowing to the FIN certificates</text>
<text x="22" y="1385" fill="#9aa4b4" xml:space="preserve">    maya could have seen.)</text>
<text x="22" y="1427" fill="#4fb8e8">$</text>
<text x="38.8" y="1427" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/certificates                        (maya, every department)</text>
<text x="22" y="1448" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1469" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1490" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="1511" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="1532" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="1553" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="1574" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1595" fill="#e0787c" xml:space="preserve">    403</text>
<text x="22" y="1637" fill="#4fb8e8">$</text>
<text x="38.8" y="1637" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/departments/FIN/certificates        (maya, within FIN)</text>
<text x="22" y="1658" fill="#9aa4b4" xml:space="preserve">    [</text>
<text x="22" y="1679" fill="#9aa4b4" xml:space="preserve">        {</text>
<text x="22" y="1700" fill="#9aa4b4" xml:space="preserve">            &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="1721" fill="#9aa4b4" xml:space="preserve">            &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="1742" fill="#9aa4b4" xml:space="preserve">            &quot;certificate_id&quot;: &quot;C17&quot;,</text>
<text x="22" y="1763" fill="#9aa4b4" xml:space="preserve">            &quot;employee_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1784" fill="#9aa4b4" xml:space="preserve">            &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1805" fill="#9aa4b4" xml:space="preserve">            &quot;title&quot;: &quot;FIN annual&quot;</text>
<text x="22" y="1826" fill="#9aa4b4" xml:space="preserve">        },</text>
<text x="22" y="1847" fill="#9aa4b4" xml:space="preserve">        {</text>
<text x="22" y="1868" fill="#9aa4b4" xml:space="preserve">            &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="1889" fill="#9aa4b4" xml:space="preserve">            &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="1910" fill="#9aa4b4" xml:space="preserve">            &quot;certificate_id&quot;: &quot;C19&quot;,</text>
<text x="22" y="1931" fill="#9aa4b4" xml:space="preserve">            &quot;employee_id&quot;: &quot;fi7io4lvjwu8&quot;,</text>
<text x="22" y="1952" fill="#9aa4b4" xml:space="preserve">            &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1973" fill="#9aa4b4" xml:space="preserve">            &quot;title&quot;: &quot;FIN supplemental&quot;</text>
<text x="22" y="1994" fill="#9aa4b4" xml:space="preserve">        }</text>
<text x="22" y="2015" fill="#9aa4b4" xml:space="preserve">    ]</text>
<text x="22" y="2036" fill="#6cc292" xml:space="preserve">    200</text>
<text x="22" y="2078" fill="#d9a441" xml:space="preserve">══ WHAT CROSSED THE BOUNDARY ══</text>
<text x="22" y="2099" fill="#6b7687" xml:space="preserve">   (one question per request, and it is always the same question)</text>
<text x="22" y="2141" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2162" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2183" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2204" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2225" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2246" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2288" fill="#d9a441" xml:space="preserve">══ WHAT THE APPLICATION LINKS ══</text>
<text x="22" y="2309" fill="#6b7687" xml:space="preserve">   (the claim the split exists to make, checked rather than trusted)</text>
<text x="22" y="2351" fill="#4fb8e8">$</text>
<text x="38.8" y="2351" fill="#e8ecf2" xml:space="preserve">go list -deps ./cmd/hrms | grep agentlabs</text>
<text x="22" y="2372" fill="#9aa4b4" xml:space="preserve">    agentlabs.local/authmiddleware</text>
<text x="22" y="2393" fill="#9aa4b4" xml:space="preserve">    agentlabs.local/apps/hrms</text>
<text x="22" y="2414" fill="#9aa4b4" xml:space="preserve">    agentlabs.local/authclient</text>
<text x="22" y="2435" fill="#9aa4b4" xml:space="preserve">    agentlabs.local/apps/hrms/cmd/hrms</text>
<text x="22" y="2477" fill="#d9a441" xml:space="preserve">══ AND WHEN AUTH IS DOWN ══</text>
<text x="22" y="2498" fill="#6b7687" xml:space="preserve">   (an outage is an evaluation failure, never a denial — Q-128. A gate</text>
<text x="22" y="2519" fill="#9aa4b4" xml:space="preserve">    that answered 403 here would fail closed and lie about why.)</text>
<text x="22" y="2561" fill="#4fb8e8">$</text>
<text x="38.8" y="2561" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/FIN/C17                             (auth service stopped)</text>
<text x="22" y="2582" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="2603" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="2624" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;AUTH_UNREACHABLE&quot;,</text>
<text x="22" y="2645" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;We could not check your access.&quot;,</text>
<text x="22" y="2666" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;the authority service did not answer&quot;</text>
<text x="22" y="2687" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="2708" fill="#e0787c" xml:space="preserve">    503</text>
</svg>