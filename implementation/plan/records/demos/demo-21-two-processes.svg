<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1253 3445" width="1253" height="3445" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="1253" height="3445" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h1239a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="626.5" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">two processes — the gate on the client, the records in Auth</text>
<text x="22" y="62" fill="#d9a441" xml:space="preserve">══ SETUP — BOTH WOMEN ARE GIVEN A ROUTE ══</text>
<text x="22" y="83" fill="#6b7687" xml:space="preserve">   (the seeded fixture leaves Team2&#x27;s assignment proposed, so until this</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">    runs nutan holds nothing at all. It is captured rather than assumed,</text>
<text x="22" y="125" fill="#9aa4b4" xml:space="preserve">    because otherwise her refusal below could not be told apart from</text>
<text x="22" y="146" fill="#9aa4b4" xml:space="preserve">    having no grant — and the requests are what say what her route selects.)</text>
<text x="22" y="188" fill="#4fb8e8">$</text>
<text x="38.8" y="188" fill="#e8ecf2" xml:space="preserve">abv scenario seed team-fin-c17</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">    LAB ONLY: fixed fixture identity; not authenticated administration</text>
<text x="22" y="230" fill="#9aa4b4" xml:space="preserve">    scenario seeded</text>
<text x="22" y="251" fill="#4fb8e8">$</text>
<text x="38.8" y="251" fill="#e8ecf2" xml:space="preserve">abv assign --file a2.json   (Team2, so nutan has a route at all)</text>
<text x="22" y="272" fill="#9aa4b4" xml:space="preserve">    LAB ONLY: fixture-context is not authenticated identity; both authority gates are rechecked</text>
<text x="22" y="293" fill="#9aa4b4" xml:space="preserve">    assignment fm5b7t4pan0d created</text>
<text x="22" y="335" fill="#d9a441" xml:space="preserve">══ TWO PROCESSES ══</text>
<text x="22" y="356" fill="#6b7687" xml:space="preserve">   (the Auth service holds the records. The application holds none —</text>
<text x="22" y="377" fill="#9aa4b4" xml:space="preserve">    it is given a URL where it used to be given a database path.)</text>
<text x="22" y="419" fill="#4fb8e8">$</text>
<text x="38.8" y="419" fill="#e8ecf2" xml:space="preserve">auth-service --authority authority.db --registry registry.db --listen 127.0.0.1:8080</text>
<text x="22" y="440" fill="#9aa4b4" xml:space="preserve">    auth-service listening on 127.0.0.1:8080 for acme/hrms</text>
<text x="22" y="482" fill="#4fb8e8">$</text>
<text x="38.8" y="482" fill="#e8ecf2" xml:space="preserve">HRMS_AUTH_TOKEN=... hrms --auth http://127.0.0.1:8080 --listen 127.0.0.1:8081 --client agent_hrms --allow-cleartext</text>
<text x="22" y="503" fill="#9aa4b4" xml:space="preserve">    hrms listening on 127.0.0.1:8081, asking http://127.0.0.1:8080 as agent_hrms</text>
<text x="22" y="545" fill="#d9a441" xml:space="preserve">══ THE REQUEST REACHES THE HANDLER, OR IT DOES NOT ══</text>
<text x="22" y="566" fill="#6b7687" xml:space="preserve">   (maya holds payslip read and write within dept=FIN)</text>
<text x="22" y="608" fill="#4fb8e8">$</text>
<text x="38.8" y="608" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/FIN/C17                             (inside her boundary)</text>
<text x="22" y="629" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="650" fill="#9aa4b4" xml:space="preserve">        &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="671" fill="#9aa4b4" xml:space="preserve">        &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="692" fill="#9aa4b4" xml:space="preserve">        &quot;certificate_id&quot;: &quot;C17&quot;,</text>
<text x="22" y="713" fill="#9aa4b4" xml:space="preserve">        &quot;employee_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="734" fill="#9aa4b4" xml:space="preserve">        &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="755" fill="#9aa4b4" xml:space="preserve">        &quot;title&quot;: &quot;FIN annual&quot;</text>
<text x="22" y="776" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="797" fill="#9aa4b4" xml:space="preserve">    200</text>
<text x="22" y="839" fill="#4fb8e8">$</text>
<text x="38.8" y="839" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/ENG/C18                             (outside it)</text>
<text x="22" y="860" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="881" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="902" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="923" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="944" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="965" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="986" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1007" fill="#9aa4b4" xml:space="preserve">    403</text>
<text x="22" y="1049" fill="#d9a441" xml:space="preserve">══ SAME ENDPOINT, SAME POLICY, TWO PEOPLE ══</text>
<text x="22" y="1070" fill="#6b7687" xml:space="preserve">   (Team1&#x27;s grant carries read AND write. Team2&#x27;s child selects read</text>
<text x="22" y="1091" fill="#9aa4b4" xml:space="preserve">    only — so nutan reaches the same endpoint and is refused. Permissions</text>
<text x="22" y="1112" fill="#9aa4b4" xml:space="preserve">    are chosen by each child; scope is inherited and narrowed.)</text>
<text x="22" y="1154" fill="#4fb8e8">$</text>
<text x="38.8" y="1154" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/FIN/C17                             (nutan may read it)</text>
<text x="22" y="1175" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1196" fill="#9aa4b4" xml:space="preserve">        &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="1217" fill="#9aa4b4" xml:space="preserve">        &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="1238" fill="#9aa4b4" xml:space="preserve">        &quot;certificate_id&quot;: &quot;C17&quot;,</text>
<text x="22" y="1259" fill="#9aa4b4" xml:space="preserve">        &quot;employee_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1280" fill="#9aa4b4" xml:space="preserve">        &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1301" fill="#9aa4b4" xml:space="preserve">        &quot;title&quot;: &quot;FIN annual&quot;</text>
<text x="22" y="1322" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1343" fill="#9aa4b4" xml:space="preserve">    200</text>
<text x="22" y="1385" fill="#4fb8e8">$</text>
<text x="38.8" y="1385" fill="#e8ecf2" xml:space="preserve">curl -X PUT  /api/v1/acme/certificates/C17                    (maya may write)</text>
<text x="22" y="1406" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1427" fill="#9aa4b4" xml:space="preserve">        &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="1448" fill="#9aa4b4" xml:space="preserve">        &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="1469" fill="#9aa4b4" xml:space="preserve">        &quot;certificate_id&quot;: &quot;C17&quot;,</text>
<text x="22" y="1490" fill="#9aa4b4" xml:space="preserve">        &quot;employee_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1511" fill="#9aa4b4" xml:space="preserve">        &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="1532" fill="#9aa4b4" xml:space="preserve">        &quot;title&quot;: &quot;revised&quot;</text>
<text x="22" y="1553" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1574" fill="#9aa4b4" xml:space="preserve">    200</text>
<text x="22" y="1616" fill="#4fb8e8">$</text>
<text x="38.8" y="1616" fill="#e8ecf2" xml:space="preserve">curl -X PUT  /api/v1/acme/certificates/C17                    (nutan may not)</text>
<text x="22" y="1637" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1658" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1679" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="1700" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="1721" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="1742" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="1763" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="1784" fill="#9aa4b4" xml:space="preserve">    403</text>
<text x="22" y="1826" fill="#d9a441" xml:space="preserve">══ A THIRD ENDPOINT, AND AN ALL-VALUES ASK ══</text>
<text x="22" y="1847" fill="#6b7687" xml:space="preserve">   (the listing endpoint names no department, so it asks for every one.</text>
<text x="22" y="1868" fill="#9aa4b4" xml:space="preserve">    Q-071: that is a deny, not a quiet narrowing to the FIN certificates</text>
<text x="22" y="1889" fill="#9aa4b4" xml:space="preserve">    maya could have seen.)</text>
<text x="22" y="1931" fill="#4fb8e8">$</text>
<text x="38.8" y="1931" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/certificates                        (maya, every department)</text>
<text x="22" y="1952" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="1973" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="1994" fill="#9aa4b4" xml:space="preserve">        &quot;decision&quot;: &quot;deny&quot;,</text>
<text x="22" y="2015" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;NO_AUTHORIZING_GRANT&quot;,</text>
<text x="22" y="2036" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;You do not have access to this resource.&quot;,</text>
<text x="22" y="2057" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;No grant authorizes this operation within the requested boundary.&quot;</text>
<text x="22" y="2078" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="2099" fill="#9aa4b4" xml:space="preserve">    403</text>
<text x="22" y="2141" fill="#4fb8e8">$</text>
<text x="38.8" y="2141" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/departments/FIN/certificates        (maya, within FIN)</text>
<text x="22" y="2162" fill="#9aa4b4" xml:space="preserve">    [</text>
<text x="22" y="2183" fill="#9aa4b4" xml:space="preserve">        {</text>
<text x="22" y="2204" fill="#9aa4b4" xml:space="preserve">            &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="2225" fill="#9aa4b4" xml:space="preserve">            &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="2246" fill="#9aa4b4" xml:space="preserve">            &quot;certificate_id&quot;: &quot;C17&quot;,</text>
<text x="22" y="2267" fill="#9aa4b4" xml:space="preserve">            &quot;employee_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="2288" fill="#9aa4b4" xml:space="preserve">            &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="2309" fill="#9aa4b4" xml:space="preserve">            &quot;title&quot;: &quot;FIN annual&quot;</text>
<text x="22" y="2330" fill="#9aa4b4" xml:space="preserve">        },</text>
<text x="22" y="2351" fill="#9aa4b4" xml:space="preserve">        {</text>
<text x="22" y="2372" fill="#9aa4b4" xml:space="preserve">            &quot;tenant_id&quot;: &quot;acme&quot;,</text>
<text x="22" y="2393" fill="#9aa4b4" xml:space="preserve">            &quot;department_id&quot;: &quot;FIN&quot;,</text>
<text x="22" y="2414" fill="#9aa4b4" xml:space="preserve">            &quot;certificate_id&quot;: &quot;C19&quot;,</text>
<text x="22" y="2435" fill="#9aa4b4" xml:space="preserve">            &quot;employee_id&quot;: &quot;fi7io4lvjwu8&quot;,</text>
<text x="22" y="2456" fill="#9aa4b4" xml:space="preserve">            &quot;owner_id&quot;: &quot;fi7io4lvjqio&quot;,</text>
<text x="22" y="2477" fill="#9aa4b4" xml:space="preserve">            &quot;title&quot;: &quot;FIN supplemental&quot;</text>
<text x="22" y="2498" fill="#9aa4b4" xml:space="preserve">        }</text>
<text x="22" y="2519" fill="#9aa4b4" xml:space="preserve">    ]</text>
<text x="22" y="2540" fill="#9aa4b4" xml:space="preserve">    200</text>
<text x="22" y="2582" fill="#d9a441" xml:space="preserve">══ WHAT CROSSED THE BOUNDARY ══</text>
<text x="22" y="2603" fill="#6b7687" xml:space="preserve">   (one question per request, and the body is the claim worth checking:</text>
<text x="22" y="2624" fill="#9aa4b4" xml:space="preserve">    the application asks what a human holds — never whether to allow, and</text>
<text x="22" y="2645" fill="#9aa4b4" xml:space="preserve">    no longer even which permission it is about)</text>
<text x="22" y="2687" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2708" fill="#9aa4b4" xml:space="preserve">          {&quot;version&quot;:&quot;1&quot;,&quot;identity&quot;:{&quot;version&quot;:&quot;1&quot;,&quot;actor&quot;:{&quot;type&quot;:&quot;service_account&quot;,&quot;id&quot;:&quot;agent_hrms&quot;},&quot;human_id&quot;:&quot;fi7io4lvjqio&quot;},&quot;options&quot;:{}}</text>
<text x="22" y="2729" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2750" fill="#9aa4b4" xml:space="preserve">          {&quot;version&quot;:&quot;1&quot;,&quot;identity&quot;:{&quot;version&quot;:&quot;1&quot;,&quot;actor&quot;:{&quot;type&quot;:&quot;service_account&quot;,&quot;id&quot;:&quot;agent_hrms&quot;},&quot;human_id&quot;:&quot;fi7io4lvjqio&quot;},&quot;options&quot;:{}}</text>
<text x="22" y="2771" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2792" fill="#9aa4b4" xml:space="preserve">          {&quot;version&quot;:&quot;1&quot;,&quot;identity&quot;:{&quot;version&quot;:&quot;1&quot;,&quot;actor&quot;:{&quot;type&quot;:&quot;service_account&quot;,&quot;id&quot;:&quot;agent_hrms&quot;},&quot;human_id&quot;:&quot;fi7io4lvjwu8&quot;},&quot;options&quot;:{}}</text>
<text x="22" y="2813" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2834" fill="#9aa4b4" xml:space="preserve">          {&quot;version&quot;:&quot;1&quot;,&quot;identity&quot;:{&quot;version&quot;:&quot;1&quot;,&quot;actor&quot;:{&quot;type&quot;:&quot;service_account&quot;,&quot;id&quot;:&quot;agent_hrms&quot;},&quot;human_id&quot;:&quot;fi7io4lvjqio&quot;},&quot;options&quot;:{}}</text>
<text x="22" y="2855" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2876" fill="#9aa4b4" xml:space="preserve">          {&quot;version&quot;:&quot;1&quot;,&quot;identity&quot;:{&quot;version&quot;:&quot;1&quot;,&quot;actor&quot;:{&quot;type&quot;:&quot;service_account&quot;,&quot;id&quot;:&quot;agent_hrms&quot;},&quot;human_id&quot;:&quot;fi7io4lvjwu8&quot;},&quot;options&quot;:{}}</text>
<text x="22" y="2897" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2918" fill="#9aa4b4" xml:space="preserve">          {&quot;version&quot;:&quot;1&quot;,&quot;identity&quot;:{&quot;version&quot;:&quot;1&quot;,&quot;actor&quot;:{&quot;type&quot;:&quot;service_account&quot;,&quot;id&quot;:&quot;agent_hrms&quot;},&quot;human_id&quot;:&quot;fi7io4lvjqio&quot;},&quot;options&quot;:{}}</text>
<text x="22" y="2939" fill="#9aa4b4" xml:space="preserve">    auth  &lt;- POST /api/v1/acme/abv/applications/hrms/authority.resolve</text>
<text x="22" y="2960" fill="#9aa4b4" xml:space="preserve">          {&quot;version&quot;:&quot;1&quot;,&quot;identity&quot;:{&quot;version&quot;:&quot;1&quot;,&quot;actor&quot;:{&quot;type&quot;:&quot;service_account&quot;,&quot;id&quot;:&quot;agent_hrms&quot;},&quot;human_id&quot;:&quot;fi7io4lvjqio&quot;},&quot;options&quot;:{}}</text>
<text x="22" y="3002" fill="#d9a441" xml:space="preserve">══ WHAT THE APPLICATION LINKS ══</text>
<text x="22" y="3023" fill="#6b7687" xml:space="preserve">   (the claim the split exists to make, checked rather than trusted)</text>
<text x="22" y="3065" fill="#4fb8e8">$</text>
<text x="38.8" y="3065" fill="#e8ecf2" xml:space="preserve">go list -deps ./cmd/hrms | grep agentlabs</text>
<text x="22" y="3086" fill="#9aa4b4" xml:space="preserve">    agentlabs.local/authmiddleware</text>
<text x="22" y="3107" fill="#9aa4b4" xml:space="preserve">    agentlabs.local/apps/hrms</text>
<text x="22" y="3128" fill="#9aa4b4" xml:space="preserve">    agentlabs.local/authclient</text>
<text x="22" y="3149" fill="#9aa4b4" xml:space="preserve">    agentlabs.local/apps/hrms/cmd/hrms</text>
<text x="22" y="3191" fill="#d9a441" xml:space="preserve">══ AND WHEN AUTH IS DOWN ══</text>
<text x="22" y="3212" fill="#6b7687" xml:space="preserve">   (an outage is an evaluation failure, never a denial — Q-051. A gate</text>
<text x="22" y="3233" fill="#9aa4b4" xml:space="preserve">    that answered 403 here would fail closed and lie about why.)</text>
<text x="22" y="3275" fill="#4fb8e8">$</text>
<text x="38.8" y="3275" fill="#e8ecf2" xml:space="preserve">curl -X GET  /api/v1/acme/FIN/C17                             (auth service stopped)</text>
<text x="22" y="3296" fill="#9aa4b4" xml:space="preserve">    {</text>
<text x="22" y="3317" fill="#9aa4b4" xml:space="preserve">        &quot;version&quot;: &quot;1&quot;,</text>
<text x="22" y="3338" fill="#9aa4b4" xml:space="preserve">        &quot;error_code&quot;: &quot;AUTHORITY_UNREACHABLE&quot;,</text>
<text x="22" y="3359" fill="#9aa4b4" xml:space="preserve">        &quot;error_message&quot;: &quot;We could not check your access.&quot;,</text>
<text x="22" y="3380" fill="#9aa4b4" xml:space="preserve">        &quot;error_message_reason&quot;: &quot;the authority service did not answer&quot;</text>
<text x="22" y="3401" fill="#9aa4b4" xml:space="preserve">    }</text>
<text x="22" y="3422" fill="#9aa4b4" xml:space="preserve">    503</text>
</svg>