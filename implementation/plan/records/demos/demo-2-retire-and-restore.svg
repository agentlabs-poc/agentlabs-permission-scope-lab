<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 699 757" width="699" height="757" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="699" height="757" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h685a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="349.5" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — status</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># retire and restore are one reversible operation</text>
<text x="22" y="83" fill="#4fb8e8">$</text>
<text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv catalog set-permission-status …certificate::write --active false</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">id      hrms:employee:certificate::write</text>
<text x="22" y="125" fill="#e0787c" xml:space="preserve">active  false</text>
<text x="22" y="167" fill="#6b7687" xml:space="preserve"># a separate process, same database — persistence is real</text>
<text x="22" y="188" fill="#4fb8e8">$</text>
<text x="38.8" y="188" fill="#e8ecf2" xml:space="preserve">abv catalog get-permission hrms:employee:certificate::write</text>
<text x="22" y="209" fill="#9aa4b4" xml:space="preserve">id      hrms:employee:certificate::write</text>
<text x="22" y="230" fill="#e0787c" xml:space="preserve">active  false</text>
<text x="22" y="272" fill="#6b7687" xml:space="preserve"># retired is reported, not hidden: withdrawn from evaluation,</text>
<text x="22" y="293" fill="#6b7687" xml:space="preserve"># still visible to administration</text>
<text x="22" y="314" fill="#4fb8e8">$</text>
<text x="38.8" y="314" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --prefix hrms:employee:certificate:</text>
<text x="22" y="335" fill="#9aa4b4" xml:space="preserve">count  2     total  2     generation  3</text>
<text x="22" y="356" fill="#9aa4b4" xml:space="preserve">hrms:employee:certificate::read     active=true</text>
<text x="22" y="377" fill="#e0787c" xml:space="preserve">hrms:employee:certificate::write    active=false</text>
<text x="22" y="419" fill="#6b7687" xml:space="preserve"># --active-only is the filter that omits it</text>
<text x="22" y="440" fill="#4fb8e8">$</text>
<text x="38.8" y="440" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --prefix hrms:employee:certificate: --active-only</text>
<text x="22" y="461" fill="#9aa4b4" xml:space="preserve">count  1     total  1     generation  3</text>
<text x="22" y="482" fill="#9aa4b4" xml:space="preserve">hrms:employee:certificate::read     active=true</text>
<text x="22" y="524" fill="#6b7687" xml:space="preserve"># idempotent — setting the status it already holds succeeds</text>
<text x="22" y="545" fill="#4fb8e8">$</text>
<text x="38.8" y="545" fill="#e8ecf2" xml:space="preserve">abv catalog set-permission-status …certificate::write --active false</text>
<text x="22" y="566" fill="#e0787c" xml:space="preserve">active  false                                         rc=0</text>
<text x="22" y="608" fill="#6b7687" xml:space="preserve"># reversible — the same operation restores it</text>
<text x="22" y="629" fill="#4fb8e8">$</text>
<text x="38.8" y="629" fill="#e8ecf2" xml:space="preserve">abv catalog set-permission-status …certificate::write --active true</text>
<text x="22" y="650" fill="#6cc292" xml:space="preserve">active  true                                          rc=0</text>
<text x="22" y="692" fill="#6b7687" xml:space="preserve"># a status change can never bring an identifier into existence</text>
<text x="22" y="713" fill="#4fb8e8">$</text>
<text x="38.8" y="713" fill="#e8ecf2" xml:space="preserve">abv catalog set-permission-status hrms:employee:invented::read --active true</text>
<text x="22" y="734" fill="#e0787c" xml:space="preserve">operation rejected or record not found                rc=3</text>
</svg>