<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1166 2212" width="1166" height="2212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="1166" height="2212" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h1152a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="583.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">the assignment record — keyed by the binding</text>
<text x="18" y="60" fill="#d9a441" xml:space="preserve">══ BOTH DIRECTIONS — and neither is not a question ══</text>
<text x="18" y="80" fill="#4fb8e8" xml:space="preserve">$ abv assignments list --grant fk3x9r2m5iv8</text>
<text x="18" y="100" fill="#9aa4b4" xml:space="preserve">    internal projection: assignments</text>
<text x="18" y="120" fill="#9aa4b4" xml:space="preserve">    count  1</text>
<text x="18" y="140" fill="#9aa4b4" xml:space="preserve">    total  1</text>
<text x="18" y="160" fill="#9aa4b4" xml:space="preserve">    fk3x9r2m5iv8   group  fibggi2juubk   rev 1    enabled   fm5b7t4p5iv8</text>
<text x="18" y="180" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="200" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="220" fill="#4fb8e8" xml:space="preserve">$ abv assignments list --recipient fibggi2juubk --recipient-type group</text>
<text x="18" y="240" fill="#9aa4b4" xml:space="preserve">    internal projection: assignments</text>
<text x="18" y="260" fill="#9aa4b4" xml:space="preserve">    count  1</text>
<text x="18" y="280" fill="#9aa4b4" xml:space="preserve">    total  1</text>
<text x="18" y="300" fill="#9aa4b4" xml:space="preserve">    fk3x9r2m5iv8   group  fibggi2juubk   rev 1    enabled   fm5b7t4p5iv8</text>
<text x="18" y="320" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="340" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="360" fill="#4fb8e8" xml:space="preserve">$ abv assignments list</text>
<text x="18" y="380" fill="#9aa4b4" xml:space="preserve">    assignments list requires exactly one of --grant and --recipient: a listing of every assignment is unbounded in the dimension that grows fastest</text>
<text x="18" y="400" fill="#e0787c" xml:space="preserve">    rc=2</text>
<text x="18" y="420" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="440" fill="#d9a441" xml:space="preserve">══ ONE RECORD — the binding identifies it, the id is a handle ══</text>
<text x="18" y="460" fill="#4fb8e8" xml:space="preserve">$ abv assignments get fm5b7t4p5iv8</text>
<text x="18" y="480" fill="#9aa4b4" xml:space="preserve">    internal projection: assignment</text>
<text x="18" y="500" fill="#9aa4b4" xml:space="preserve">    grant  fk3x9r2m5iv8</text>
<text x="18" y="520" fill="#9aa4b4" xml:space="preserve">    recipient  group fibggi2juubk</text>
<text x="18" y="540" fill="#9aa4b4" xml:space="preserve">    id  fm5b7t4p5iv8</text>
<text x="18" y="560" fill="#9aa4b4" xml:space="preserve">    adopted revision  1</text>
<text x="18" y="580" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="18" y="600" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="620" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="640" fill="#d9a441" xml:space="preserve">══ Q-104 — a duplicate binding is refused ══</text>
<text x="18" y="660" fill="#6b7687" xml:space="preserve">   (refused here by the lab&#x27;s administrative gate, which never reaches</text>
<text x="18" y="680" fill="#9aa4b4" xml:space="preserve">    storage. That Q-104 is ALSO the envelope&#x27;s primary key — so a writer</text>
<text x="18" y="700" fill="#9aa4b4" xml:space="preserve">    past the gate still cannot create one — is asserted in</text>
<text x="18" y="720" fill="#9aa4b4" xml:space="preserve">    internal/storage/sqlite/assignment_l1_test.go, not here.)</text>
<text x="18" y="740" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="760" fill="#4fb8e8" xml:space="preserve">$ abv assign --file /tmp/abvdemo/dup2.json --tenant acme --app hrms --db /tmp/abvdemo/asgdemo.db --fixture-context maya-team1</text>
<text x="18" y="780" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="18" y="800" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="820" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="840" fill="#d9a441" xml:space="preserve">══ UPGRADE — the latest, never an intermediate ══</text>
<text x="18" y="860" fill="#4fb8e8" xml:space="preserve">$ abv assign --file /tmp/abvdemo/a2.json --tenant acme --app hrms --db /tmp/abvdemo/asgdemo.db --fixture-context maya-team1</text>
<text x="18" y="880" fill="#9aa4b4" xml:space="preserve">    assignment fm5b7t4pan0d created</text>
<text x="18" y="900" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="920" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="940" fill="#4fb8e8" xml:space="preserve">$ abv assignments get fm5b7t4pan0d</text>
<text x="18" y="960" fill="#9aa4b4" xml:space="preserve">    internal projection: assignment</text>
<text x="18" y="980" fill="#9aa4b4" xml:space="preserve">    grant  fk3x9r2man0d</text>
<text x="18" y="1000" fill="#9aa4b4" xml:space="preserve">    recipient  group fibggi2juxhc</text>
<text x="18" y="1020" fill="#9aa4b4" xml:space="preserve">    id  fm5b7t4pan0d</text>
<text x="18" y="1040" fill="#9aa4b4" xml:space="preserve">    adopted revision  1</text>
<text x="18" y="1060" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="18" y="1080" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1100" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1120" fill="#6b7687" xml:space="preserve">   revisions 2 and 3 of fk3x9r2man0d published — the assignment has not moved:</text>
<text x="18" y="1140" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1160" fill="#4fb8e8" xml:space="preserve">$ abv assignments get fm5b7t4pan0d</text>
<text x="18" y="1180" fill="#9aa4b4" xml:space="preserve">    internal projection: assignment</text>
<text x="18" y="1200" fill="#9aa4b4" xml:space="preserve">    grant  fk3x9r2man0d</text>
<text x="18" y="1220" fill="#9aa4b4" xml:space="preserve">    recipient  group fibggi2juxhc</text>
<text x="18" y="1240" fill="#9aa4b4" xml:space="preserve">    id  fm5b7t4pan0d</text>
<text x="18" y="1260" fill="#9aa4b4" xml:space="preserve">    adopted revision  1</text>
<text x="18" y="1280" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="18" y="1300" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1320" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1340" fill="#4fb8e8" xml:space="preserve">$ abv assignments upgrade fm5b7t4pan0d</text>
<text x="18" y="1360" fill="#9aa4b4" xml:space="preserve">    internal projection: assignment</text>
<text x="18" y="1380" fill="#9aa4b4" xml:space="preserve">    grant  fk3x9r2man0d</text>
<text x="18" y="1400" fill="#9aa4b4" xml:space="preserve">    recipient  group fibggi2juxhc</text>
<text x="18" y="1420" fill="#9aa4b4" xml:space="preserve">    id  fm5b7t4pan0d</text>
<text x="18" y="1440" fill="#9aa4b4" xml:space="preserve">    adopted revision  3</text>
<text x="18" y="1460" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="18" y="1480" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1500" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1520" fill="#4fb8e8" xml:space="preserve">$ abv assignments upgrade fm5b7t4pan0d</text>
<text x="18" y="1540" fill="#9aa4b4" xml:space="preserve">    internal projection: assignment</text>
<text x="18" y="1560" fill="#9aa4b4" xml:space="preserve">    grant  fk3x9r2man0d</text>
<text x="18" y="1580" fill="#9aa4b4" xml:space="preserve">    recipient  group fibggi2juxhc</text>
<text x="18" y="1600" fill="#9aa4b4" xml:space="preserve">    id  fm5b7t4pan0d</text>
<text x="18" y="1620" fill="#9aa4b4" xml:space="preserve">    adopted revision  3</text>
<text x="18" y="1640" fill="#9aa4b4" xml:space="preserve">    status  enabled</text>
<text x="18" y="1660" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1680" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1700" fill="#d9a441" xml:space="preserve">══ DELETE — refuses while a dependent route rests on it ══</text>
<text x="18" y="1720" fill="#4fb8e8" xml:space="preserve">$ abv assignments delete fm5b7t4p5iv8</text>
<text x="18" y="1740" fill="#9aa4b4" xml:space="preserve">    operation conflict</text>
<text x="18" y="1760" fill="#e0787c" xml:space="preserve">    rc=4</text>
<text x="18" y="1780" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1800" fill="#4fb8e8" xml:space="preserve">$ abv assignments delete absent</text>
<text x="18" y="1820" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="18" y="1840" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="1860" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1880" fill="#4fb8e8" xml:space="preserve">$ abv assignments delete fm5b7t4pan0d</text>
<text x="18" y="1900" fill="#9aa4b4" xml:space="preserve">    internal projection: assignment</text>
<text x="18" y="1920" fill="#9aa4b4" xml:space="preserve">    deleted  fm5b7t4pan0d</text>
<text x="18" y="1940" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1960" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="1980" fill="#d9a441" xml:space="preserve">══ THE ROWS — the binding is the key path ══</text>
<text x="18" y="2000" fill="#6b7687" xml:space="preserve">   (each heading names the real column and what it holds. there is no</text>
<text x="18" y="2020" fill="#9aa4b4" xml:space="preserve">    grant_id or recipient column — key4, key5 and key6 ARE the binding.)</text>
<text x="18" y="2040" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="2060" fill="#8899ab" xml:space="preserve">╭────────────┬──────────┬──────────────┬────────────────┬────────────────┬─────────────────────────────────────────────────────────────╮</text>
<text x="18" y="2080" fill="#8899ab" xml:space="preserve">│ key2 type  │ key3 app │  key4 grant  │ key5 rcpt type │ key6 recipient │                            value                            │</text>
<text x="18" y="2100" fill="#8899ab" xml:space="preserve">╞════════════╪══════════╪══════════════╪════════════════╪════════════════╪═════════════════════════════════════════════════════════════╡</text>
<text x="18" y="2120" fill="#8899ab" xml:space="preserve">│ assignment │ hrms     │ fk3x9r2m0dq3 │ group          │ fibggi2jur5s   │ {&quot;id&quot;:&quot;fm5b7t4p0dq3&quot;,&quot;grant_revision&quot;:1,&quot;status&quot;:&quot;enabled&quot;} │</text>
<text x="18" y="2140" fill="#8899ab" xml:space="preserve">│ assignment │ hrms     │ fk3x9r2m5iv8 │ group          │ fibggi2juubk   │ {&quot;id&quot;:&quot;fm5b7t4p5iv8&quot;,&quot;grant_revision&quot;:1,&quot;status&quot;:&quot;enabled&quot;} │</text>
<text x="18" y="2160" fill="#8899ab" xml:space="preserve">╰────────────┴──────────┴──────────────┴────────────────┴────────────────┴─────────────────────────────────────────────────────────────╯</text>
<text x="18" y="2180" fill="#9aa4b4" xml:space="preserve"></text>
<text x="18" y="2200" fill="#9aa4b4" xml:space="preserve">  tables: abv_metadata abv_l1_records abv_lab_metadata</text>
</svg>