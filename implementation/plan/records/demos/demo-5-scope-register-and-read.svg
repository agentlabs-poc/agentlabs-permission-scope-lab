<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1432" width="640" height="1432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
<rect width="640" height="1432" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h626a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17" r="5" fill="#e0787c"/><circle cx="38" cy="17" r="5" fill="#d9a441"/><circle cx="56" cy="17" r="5" fill="#6cc292"/>
<text x="320.0" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">the scope record — registration and read</text>
<text x="18" y="60" fill="#9aa4b4" xml:space="preserve">── register: add-only, wildcard rejected anywhere in the key ──</text>
<text x="18" y="80" fill="#4fb8e8" xml:space="preserve">$ abv catalog register-scope region</text>
<text x="18" y="100" fill="#9aa4b4" xml:space="preserve">    internal projection: scope</text>
<text x="18" y="120" fill="#9aa4b4" xml:space="preserve">    key  region</text>
<text x="18" y="140" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="160" fill="#4fb8e8" xml:space="preserve">$ abv catalog register-scope region</text>
<text x="18" y="180" fill="#9aa4b4" xml:space="preserve">    operation conflict</text>
<text x="18" y="200" fill="#e0787c" xml:space="preserve">    rc=4</text>
<text x="18" y="220" fill="#4fb8e8" xml:space="preserve">$ abv catalog register-scope bad*</text>
<text x="18" y="240" fill="#9aa4b4" xml:space="preserve">    malformed input</text>
<text x="18" y="260" fill="#e0787c" xml:space="preserve">    rc=2</text>
<text x="18" y="280" fill="#4fb8e8" xml:space="preserve">$ abv catalog register-scope *</text>
<text x="18" y="300" fill="#9aa4b4" xml:space="preserve">    malformed input</text>
<text x="18" y="320" fill="#e0787c" xml:space="preserve">    rc=2</text>
<text x="18" y="340" fill="#9aa4b4" xml:space="preserve">── read: typed, by exact key ──</text>
<text x="18" y="360" fill="#4fb8e8" xml:space="preserve">$ abv catalog get-scope dept</text>
<text x="18" y="380" fill="#9aa4b4" xml:space="preserve">    internal projection: scope</text>
<text x="18" y="400" fill="#9aa4b4" xml:space="preserve">    key  dept</text>
<text x="18" y="420" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="440" fill="#4fb8e8" xml:space="preserve">$ abv catalog get-scope missing</text>
<text x="18" y="460" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="18" y="480" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="500" fill="#4fb8e8" xml:space="preserve">$ abv catalog get-scope $self</text>
<text x="18" y="520" fill="#9aa4b4" xml:space="preserve">    operation rejected or record not found</text>
<text x="18" y="540" fill="#e0787c" xml:space="preserve">    rc=3</text>
<text x="18" y="560" fill="#9aa4b4" xml:space="preserve">── list: ordered by key, offset paged, bounded ──</text>
<text x="18" y="580" fill="#4fb8e8" xml:space="preserve">$ abv catalog list-scopes</text>
<text x="18" y="600" fill="#9aa4b4" xml:space="preserve">    internal projection: scopes</text>
<text x="18" y="620" fill="#9aa4b4" xml:space="preserve">    count  4</text>
<text x="18" y="640" fill="#9aa4b4" xml:space="preserve">    total  4</text>
<text x="18" y="660" fill="#9aa4b4" xml:space="preserve">    generation  1</text>
<text x="18" y="680" fill="#9aa4b4" xml:space="preserve">    cert</text>
<text x="18" y="700" fill="#9aa4b4" xml:space="preserve">    dept</text>
<text x="18" y="720" fill="#9aa4b4" xml:space="preserve">    region</text>
<text x="18" y="740" fill="#9aa4b4" xml:space="preserve">    user</text>
<text x="18" y="760" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="780" fill="#4fb8e8" xml:space="preserve">$ abv catalog list-scopes --offset 2 --limit 2</text>
<text x="18" y="800" fill="#9aa4b4" xml:space="preserve">    internal projection: scopes</text>
<text x="18" y="820" fill="#9aa4b4" xml:space="preserve">    count  2</text>
<text x="18" y="840" fill="#9aa4b4" xml:space="preserve">    total  4</text>
<text x="18" y="860" fill="#9aa4b4" xml:space="preserve">    generation  1</text>
<text x="18" y="880" fill="#9aa4b4" xml:space="preserve">    region</text>
<text x="18" y="900" fill="#9aa4b4" xml:space="preserve">    user</text>
<text x="18" y="920" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="940" fill="#4fb8e8" xml:space="preserve">$ abv catalog list-scopes --offset 99</text>
<text x="18" y="960" fill="#9aa4b4" xml:space="preserve">    internal projection: scopes</text>
<text x="18" y="980" fill="#9aa4b4" xml:space="preserve">    count  0</text>
<text x="18" y="1000" fill="#9aa4b4" xml:space="preserve">    total  4</text>
<text x="18" y="1020" fill="#9aa4b4" xml:space="preserve">    generation  1</text>
<text x="18" y="1040" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1060" fill="#4fb8e8" xml:space="preserve">$ abv catalog list-scopes --limit 501</text>
<text x="18" y="1080" fill="#9aa4b4" xml:space="preserve">    malformed input</text>
<text x="18" y="1100" fill="#e0787c" xml:space="preserve">    rc=2</text>
<text x="18" y="1120" fill="#9aa4b4" xml:space="preserve">── one L1 record store, two record types ──</text>
<text x="18" y="1140" fill="#4fb8e8" xml:space="preserve">$ abv catalog register-permission hrms:payroll::read</text>
<text x="18" y="1160" fill="#9aa4b4" xml:space="preserve">    internal projection: permission</text>
<text x="18" y="1180" fill="#9aa4b4" xml:space="preserve">    id  hrms:payroll::read</text>
<text x="18" y="1200" fill="#9aa4b4" xml:space="preserve">    active  true</text>
<text x="18" y="1220" fill="#6cc292" xml:space="preserve">    rc=0</text>
<text x="18" y="1240" fill="#4fb8e8" xml:space="preserve">$ abv catalog list-permissions</text>
<text x="18" y="1260" fill="#9aa4b4" xml:space="preserve">    internal projection: permissions</text>
<text x="18" y="1280" fill="#9aa4b4" xml:space="preserve">    count  4</text>
<text x="18" y="1300" fill="#9aa4b4" xml:space="preserve">    total  4</text>
<text x="18" y="1320" fill="#9aa4b4" xml:space="preserve">    generation  2</text>
<text x="18" y="1340" fill="#9aa4b4" xml:space="preserve">    hrms:payroll::read  active=true</text>
<text x="18" y="1360" fill="#9aa4b4" xml:space="preserve">    hrms:payroll:payslip::delete  active=true</text>
<text x="18" y="1380" fill="#9aa4b4" xml:space="preserve">    hrms:payroll:payslip::read  active=true</text>
<text x="18" y="1400" fill="#9aa4b4" xml:space="preserve">    hrms:payroll:payslip::write  active=true</text>
<text x="18" y="1420" fill="#6cc292" xml:space="preserve">    rc=0</text>
</svg>