<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 623 484" width="623" height="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="623" height="484" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h609a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="311.5" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — scope · register · get</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># registration is add-only and rejects a wildcard anywhere in the key</text>
<text x="22" y="83" fill="#4fb8e8">$</text>
<text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv catalog register-scope region</text>
<text x="22" y="104" fill="#9aa4b4" xml:space="preserve">key  region</text>
<text x="22" y="125" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="167" fill="#4fb8e8">$</text>
<text x="38.8" y="167" fill="#e8ecf2" xml:space="preserve">abv catalog register-scope region            (again)</text>
<text x="22" y="188" fill="#e0787c" xml:space="preserve">operation conflict                           rc=4</text>
<text x="22" y="230" fill="#6b7687" xml:space="preserve"># a defect this demo found — &#x27;bad*&#x27; was accepted until the run below</text>
<text x="22" y="251" fill="#4fb8e8">$</text>
<text x="38.8" y="251" fill="#e8ecf2" xml:space="preserve">abv catalog register-scope &#x27;bad*&#x27;</text>
<text x="22" y="272" fill="#e0787c" xml:space="preserve">malformed input                              rc=2</text>
<text x="22" y="314" fill="#6b7687" xml:space="preserve"># a typed read by exact key. the record carries nothing else:</text>
<text x="22" y="335" fill="#6b7687" xml:space="preserve"># allowed_tokens is gone — it appeared nowhere in the handbook</text>
<text x="22" y="356" fill="#4fb8e8">$</text>
<text x="38.8" y="356" fill="#e8ecf2" xml:space="preserve">abv catalog get-scope dept</text>
<text x="22" y="377" fill="#9aa4b4" xml:space="preserve">key  dept</text>
<text x="22" y="398" fill="#6cc292" xml:space="preserve">rc=0</text>
<text x="22" y="440" fill="#4fb8e8">$</text>
<text x="38.8" y="440" fill="#e8ecf2" xml:space="preserve">abv catalog get-scope missing</text>
<text x="22" y="461" fill="#e0787c" xml:space="preserve">operation rejected or record not found       rc=3</text>
</svg>