<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 799" width="615" height="799" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="615" height="799" rx="7" fill="#12161d"/>
<path d="M0 7a7 7 0 0 1 7-7h601a7 7 0 0 1 7 7v27H0Z" fill="#1b212b"/>
<circle cx="20" cy="17.0" r="5.5" fill="#e0787c"/>
<circle cx="37" cy="17.0" r="5.5" fill="#d9a441"/>
<circle cx="54" cy="17.0" r="5.5" fill="#6cc292"/>
<text x="307.5" y="21.5" text-anchor="middle" fill="#8892a4" font-size="11.5">auth-al — list · offset paging · 603 permissions</text>
<text x="22" y="62" fill="#6b7687" xml:space="preserve"># 603 permissions in one application</text>
<text x="22" y="83" fill="#4fb8e8">$</text>
<text x="38.8" y="83" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --limit 3</text>
<text x="22" y="104" fill="#d9a441" xml:space="preserve">count  3     total  603     generation  607</text>
<text x="22" y="125" fill="#9aa4b4" xml:space="preserve">hrms:benefits:attachment::approve   active=false</text>
<text x="22" y="146" fill="#9aa4b4" xml:space="preserve">hrms:benefits:attachment::archive   active=true</text>
<text x="22" y="167" fill="#9aa4b4" xml:space="preserve">hrms:benefits:attachment::delete    active=true</text>
<text x="22" y="209" fill="#6b7687" xml:space="preserve"># total is every match, so a reader computes the page count up front</text>
<text x="22" y="230" fill="#6b7687" xml:space="preserve"># generation is the catalog version — unchanged across pages means</text>
<text x="22" y="251" fill="#6b7687" xml:space="preserve"># nothing moved between them</text>
<text x="22" y="293" fill="#6b7687" xml:space="preserve"># prefix filters on whole noun segments, never a string match</text>
<text x="22" y="314" fill="#4fb8e8">$</text>
<text x="38.8" y="314" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --prefix hrms:payroll:policy: --limit 4</text>
<text x="22" y="335" fill="#d9a441" xml:space="preserve">count  4     total  10      generation  607</text>
<text x="22" y="356" fill="#9aa4b4" xml:space="preserve">hrms:payroll:policy::approve        active=true</text>
<text x="22" y="377" fill="#9aa4b4" xml:space="preserve">hrms:payroll:policy::archive        active=true</text>
<text x="22" y="398" fill="#9aa4b4" xml:space="preserve">hrms:payroll:policy::delete         active=true</text>
<text x="22" y="419" fill="#9aa4b4" xml:space="preserve">hrms:payroll:policy::export         active=true</text>
<text x="22" y="461" fill="#6b7687" xml:space="preserve"># offset paging — a UI can jump straight to any page</text>
<text x="22" y="482" fill="#4fb8e8">$</text>
<text x="38.8" y="482" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --offset 300 --limit 3</text>
<text x="22" y="503" fill="#d9a441" xml:space="preserve">count  3     total  603     generation  607</text>
<text x="22" y="524" fill="#9aa4b4" xml:space="preserve">hrms:payroll:attachment::approve    active=false</text>
<text x="22" y="545" fill="#9aa4b4" xml:space="preserve">hrms:payroll:attachment::archive    active=true</text>
<text x="22" y="566" fill="#9aa4b4" xml:space="preserve">hrms:payroll:attachment::delete     active=true</text>
<text x="22" y="608" fill="#6b7687" xml:space="preserve"># the final partial page</text>
<text x="22" y="629" fill="#4fb8e8">$</text>
<text x="38.8" y="629" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --offset 601 --limit 5</text>
<text x="22" y="650" fill="#d9a441" xml:space="preserve">count  2     total  603     generation  607</text>
<text x="22" y="671" fill="#9aa4b4" xml:space="preserve">hrms:timesheet:summary::submit      active=true</text>
<text x="22" y="692" fill="#9aa4b4" xml:space="preserve">hrms:timesheet:summary::write       active=true</text>
<text x="22" y="734" fill="#6b7687" xml:space="preserve"># past the end is an empty page, not an error</text>
<text x="22" y="755" fill="#4fb8e8">$</text>
<text x="38.8" y="755" fill="#e8ecf2" xml:space="preserve">abv catalog list-permissions --offset 9999 --limit 5</text>
<text x="22" y="776" fill="#9aa4b4" xml:space="preserve">count  0     total  603     generation  607</text>
</svg>