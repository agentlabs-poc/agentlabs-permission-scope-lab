<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#5b6478"/>
    </marker>
    <marker id="bx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#a8452f"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#fbfcfe"/>

  <text x="30" y="26" font-size="12" font-weight="600" fill="#16202e">RegisterPermission(app, identity, {id, active})</text>

  <rect x="30" y="44" width="330" height="34" rx="4" fill="#eef3f9" stroke="#26608f" stroke-width="1.2"/>
  <text x="46" y="65" font-size="11.5" fill="#16202e">application id valid — non-blank, no *</text>
  <rect x="30" y="94" width="330" height="34" rx="4" fill="#eef3f9" stroke="#26608f" stroke-width="1.2"/>
  <text x="46" y="115" font-size="11.5" fill="#16202e">identity is a direct human</text>

  <rect x="30" y="150" width="330" height="46" rx="4" fill="#f3eef5" stroke="#6d4a76" stroke-width="1.4"/>
  <text x="46" y="170" font-size="11.5" font-weight="600" fill="#16202e">Gate 1 — platform administration</text>
  <text x="46" y="187" font-size="10.5" fill="#6d4a76">injected callback · not Auth-AL</text>

  <rect x="30" y="212" width="330" height="34" rx="4" fill="#eef3f9" stroke="#26608f" stroke-width="1.2"/>
  <text x="46" y="233" font-size="11.5" fill="#16202e">id non-blank, UTF-8, no *</text>
  <rect x="30" y="262" width="330" height="34" rx="4" fill="#eef3f9" stroke="#26608f" stroke-width="1.2"/>
  <text x="46" y="283" font-size="11.5" fill="#16202e">identifier not already registered</text>
  <rect x="30" y="312" width="330" height="34" rx="4" fill="#eef3f9" stroke="#26608f" stroke-width="1.2"/>
  <text x="46" y="333" font-size="11.5" fill="#16202e">active == true</text>
  <rect x="30" y="418" width="330" height="34" rx="4" fill="#e6efe8" stroke="#1f6b45" stroke-width="1.3"/>
  <text x="46" y="439" font-size="11.5" font-weight="600" fill="#16202e">write row</text>

  <line x1="195" y1="78" x2="195" y2="92" stroke="#5b6478" stroke-width="1.3" marker-end="url(#b)"/>
  <line x1="195" y1="128" x2="195" y2="148" stroke="#5b6478" stroke-width="1.3" marker-end="url(#b)"/>
  <line x1="195" y1="196" x2="195" y2="210" stroke="#5b6478" stroke-width="1.3" marker-end="url(#b)"/>
  <line x1="195" y1="246" x2="195" y2="260" stroke="#5b6478" stroke-width="1.3" marker-end="url(#b)"/>
  <line x1="195" y1="296" x2="195" y2="310" stroke="#5b6478" stroke-width="1.3" marker-end="url(#b)"/>
  <line x1="195" y1="346" x2="195" y2="416" stroke="#5b6478" stroke-width="1.3" marker-end="url(#b)"/>

  <line x1="362" y1="61" x2="452" y2="61" stroke="#a8452f" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#bx)"/>
  <text x="462" y="65" font-size="11" fill="#a8452f">ErrMalformed</text>
  <line x1="362" y1="111" x2="452" y2="111" stroke="#a8452f" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#bx)"/>
  <text x="462" y="115" font-size="11" fill="#a8452f">ErrUnsupported</text>
  <line x1="362" y1="173" x2="452" y2="173" stroke="#a8452f" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#bx)"/>
  <text x="462" y="177" font-size="11" fill="#a8452f">deny · nothing written</text>
  <line x1="362" y1="229" x2="452" y2="229" stroke="#a8452f" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#bx)"/>
  <text x="462" y="233" font-size="11" fill="#a8452f">ErrMalformed</text>
  <line x1="362" y1="279" x2="452" y2="279" stroke="#a8452f" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#bx)"/>
  <text x="462" y="283" font-size="11" fill="#a8452f">ErrConflict — add-only</text>
  <line x1="362" y1="329" x2="452" y2="329" stroke="#a8452f" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#bx)"/>
  <text x="462" y="333" font-size="11" fill="#a8452f">ErrRejected</text>
  <text x="462" y="437" font-size="10.5" fill="#5b6478">one catalog transaction</text>
  <text x="462" y="452" font-size="10.5" fill="#5b6478">any failure writes nothing</text>
</svg>
