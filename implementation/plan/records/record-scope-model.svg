<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="sm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#5b6478"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fbfcfe"/>

  <rect x="290" y="20" width="180" height="52" rx="4" fill="#eef3f9" stroke="#26608f" stroke-width="1.3"/>
  <text x="380" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#16202e">Application</text>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#5b6478">one shared catalog</text>

  <rect x="40" y="128" width="250" height="60" rx="4" fill="#eef3f9" stroke="#26608f" stroke-width="1.3"/>
  <text x="165" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#16202e">Permission</text>
  <text x="165" y="171" text-anchor="middle" font-size="11" fill="#5b6478">names the operation</text>

  <rect x="470" y="128" width="250" height="60" rx="4" fill="#eef3f9" stroke="#26608f" stroke-width="1.3"/>
  <text x="595" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#16202e">ScopeDefinition</text>
  <text x="595" y="171" text-anchor="middle" font-size="11" fill="#5b6478">names a boundary dimension</text>

  <path d="M338 56 H165 V126" fill="none" stroke="#5b6478" stroke-width="1.3" marker-end="url(#sm-a)"/>
  <path d="M422 56 H595 V126" fill="none" stroke="#5b6478" stroke-width="1.3" marker-end="url(#sm-a)"/>
  <text x="186" y="100" font-size="10.5" fill="#5b6478">registers</text>
  <text x="520" y="100" font-size="10.5" fill="#5b6478">registers</text>

  <text x="380" y="163" text-anchor="middle" font-size="10.5" fill="#a8452f">independent — neither</text>
  <text x="380" y="178" text-anchor="middle" font-size="10.5" fill="#a8452f">consults the other</text>

  <rect x="230" y="244" width="300" height="62" rx="4" fill="#ffffff" stroke="#5b6478" stroke-width="1"/>
  <text x="380" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#16202e">GrantContent</text>
  <text x="380" y="285" text-anchor="middle" font-size="11" fill="#5b6478">permissions[] · scope{key: value}</text>

  <path d="M290 272 H165 V190" fill="none" stroke="#5b6478" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#sm-a)"/>
  <path d="M530 272 H595 V190" fill="none" stroke="#5b6478" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#sm-a)"/>
  <text x="176" y="232" font-size="10.5" fill="#5b6478">each registered + active</text>
  <text x="440" y="232" font-size="10.5" fill="#5b6478">each key registered</text>

  <text x="40" y="326" font-size="10.5" fill="#8a93a6">a scope definition carries only its key — $self is reserved to the evaluator, and an empty scope is already a complete scope</text>
</svg>
